<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Тренажёр SAT Math</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Noto+Serif:wght@400;600&display=swap">
<style>
html,body{margin:0}

/* Layout: one narrow column. Thin top line with the channel, filters, one task, progress. Nothing else. */
:root{
  --blue:#1f5fe0; --ink:#14181f; --muted:#7a8291; --line:#e6e8ec; --bg:#ffffff; --soft:#f5f6f8;
  --ok:#15803d; --ok-bg:#effaf3; --bad:#c62828; --bad-bg:#fdf1f1;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-math:"Noto Serif","Cambria","Georgia",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --blue:#6b9bff; --ink:#e9ecf2; --muted:#8b93a3; --line:#262b35; --bg:#111318; --soft:#181b22;
  --ok:#4ade80; --ok-bg:#12261a; --bad:#f87171; --bad-bg:#2a1414; color-scheme:dark}}
:root[data-theme="dark"]{
  --blue:#6b9bff; --ink:#e9ecf2; --muted:#8b93a3; --line:#262b35; --bg:#111318; --soft:#181b22;
  --ok:#4ade80; --ok-bg:#12261a; --bad:#f87171; --bad-bg:#2a1414; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:18px 8px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{color:var(--ink);text-decoration:none;font-weight:700;font-size:15px}
.logo span{color:var(--blue);font-weight:500}
.stat{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
select{flex:1 1 150px;min-width:0;font:500 13.5px var(--f-body);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main{padding-block:20px 40px;display:grid;gap:36px}
.meta{font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
.meta .h{color:var(--blue);font-weight:600}
.q{font-family:var(--f-math);font-size:17px;line-height:1.65}
.q p{margin:0 0 10px}
.q p.eq{text-align:center;font-size:18px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.15;font-size:.92em}
.fr>span{padding:0 3px}
.fr>span:first-child{border-bottom:1.5px solid currentColor}
sup{font-size:.7em;line-height:0}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--f-math);font-size:16px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .l{flex:0 0 auto;font:600 13px var(--f-body);color:var(--muted);width:16px}
.opt .t{min-width:0}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok .l{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)} .opt.bad .l{color:var(--bad)}
.grid-in{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.grid-in input{flex:1 1 180px;min-width:0;font:500 17px var(--f-body);padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.btn{font:600 14px var(--f-body);padding:11px 18px;border-radius:10px;border:0;cursor:pointer;background:var(--blue);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:7px 12px;font-size:12.5px}
.res{margin-top:16px;border-radius:10px;padding:14px 16px}
.res.ok{background:var(--ok-bg)} .res.bad{background:var(--bad-bg)}
.res h3{margin:0 0 6px;font-size:14.5px;font-weight:700}
.res.ok h3{color:var(--ok)} .res.bad h3{color:var(--bad)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14.5px}
.steps li.desmos{color:var(--blue)}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.empty{color:var(--muted);padding:30px 0}
.prog{border-top:1px solid var(--line);padding-top:20px}
.prog h2{font-size:14px;font-weight:700;margin:0 0 4px}
.prog .note{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px}
.bar .tr{grid-column:1/-1;height:4px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--blue)}
.bar b{font-variant-numeric:tabular-nums;font-weight:500;color:var(--muted)}
.weak{margin-top:14px;font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
footer{font-size:12.5px;color:var(--muted);padding-bottom:30px}
footer a{color:var(--blue);text-decoration:none;font-weight:600}
.who{font:600 13px var(--f-body);color:var(--blue);background:none;border:0;padding:0;margin-right:10px;cursor:pointer}
.namebox{padding-block:40px}
.namebox label{display:block;font-size:20px;font-weight:700;margin-bottom:6px}
.namebox p{color:var(--muted);margin:0 0 4px;font-size:14px;max-width:44ch}
</style>
</head>
<body>


<header class="wrap">
  <div class="top">
    <a class="logo" href="https://t.me/Math_Maks" target="_blank" rel="noopener">Math Maks <span>· t.me/Math_Maks</span></a>
    <div class="stat" aria-live="polite"><button class="who" type="button" id="who" hidden></button><b id="score">0/0</b> верно · серия <b id="streak">0</b></div>
  </div>
  <div class="filters">
    <select id="dom" aria-label="Раздел SAT"></select>
    <select id="skill" aria-label="Тема"></select>
    <select id="diff" aria-label="Сложность">
      <option value="">Любая сложность</option>
      <option value="m">Medium</option>
      <option value="h">Hard</option>
    </select>
    <select id="mode" aria-label="Режим">
      <option value="all">Все задачи</option>
      <option value="new">Только новые</option>
      <option value="wrong">Мои ошибки</option>
    </select>
  </div>
</header>

<section class="wrap namebox" id="namebox" hidden>
  <form id="nf">
    <label for="ni">Как тебя зовут?</label>
    <p>Под этим именем сохранится твой прогресс. Закроешь тренажёр и вернёшься — продолжишь с того же места.</p>
    <div class="grid-in"><input id="ni" maxlength="30" autocomplete="given-name" placeholder="Имя"><button class="btn" type="submit">Начать</button></div>
  </form>
</section>
<main class="wrap" id="app">
  <section id="task" aria-live="polite"></section>
  <section class="prog" id="prog"></section>
  <footer>Задача дня и приёмы SAT Math: <a href="https://t.me/Math_Maks" target="_blank" rel="noopener">t.me/Math_Maks</a></footer>
</main>

<script>
const TASKS = [{"id":1,"s":"area_volume","t":"surface area of open box","d":"m","q":"The length of each edge of a box is 29 inches. Each side of the box is in the shape of a square. The box does not have a lid. What is the exterior surface area, in square inches, of this box without a lid?","c":[],"a":"4205","e":"У коробки без крышки 5 граней, каждая — квадрат 29 × 29.\nS = 5 · 29² = 5 · 841 = 4205."},{"id":2,"s":"area_volume","t":"cylinder volume, find radius","d":"m","q":"A right circular cylinder has a volume of 45π. If the height of the cylinder is 5, what is the radius of the cylinder?","c":["3","4.5","9","40"],"a":"A","e":"V = πr²h → πr² · 5 = 45π.\nr² = 9, r = 3."},{"id":3,"s":"area_volume","t":"area scale factor of similar squares","d":"h","q":"Square A has side lengths that are 166 times the side lengths of square B. The area of square A is k times the area of square B. What is the value of k?","c":[],"a":"27556","e":"Площадь растёт как квадрат стороны: k = 166² = 27556."},{"id":4,"s":"area_volume","t":"square with same area as circle","d":"m","q":"What is the length of one side of a square that has the same area as a circle with radius 2 ?","c":["2","√(2π)","2√π","2π"],"a":"C","e":"Площадь круга: π · 2² = 4π.\nСторона квадрата: √(4π) = 2√π."},{"id":5,"s":"area_volume","t":"right square prism volume, base edge","d":"h","q":"A right square prism has a height of 14 units. The volume of the prism is 2,016 cubic units. What is the length, in units, of an edge of the base?","c":[],"a":"12","e":"Площадь основания = 2016/14 = 144.\nРебро основания: √144 = 12."},{"id":6,"s":"area_volume","t":"perimeter of squares","d":"m","q":"Square X has a side length of 12 centimeters. The perimeter of square Y is 2 times the perimeter of square X. What is the length, in centimeters, of one side of square Y?","c":["6","10","14","24"],"a":"D","e":"P_X = 4 · 12 = 48, P_Y = 2 · 48 = 96.\nСторона Y: 96/4 = 24."},{"id":7,"s":"area_volume","t":"cylinder volume from circumference","d":"h","q":"The circumference of the base of a right circular cylinder is 20π meters, and the height of the cylinder is 6 meters. What is the volume, in cubic meters, of the cylinder?","c":["60π","120π","600π","2,400π"],"a":"C","e":"2πr = 20π → r = 10.\nV = πr²h = π · 100 · 6 = 600π."},{"id":9,"s":"area_volume","t":"area of a circle","d":"m","q":"A circle has a radius of 43 meters. What is the area, in square meters, of the circle?","c":["43π/2","43π","86π","1,849π"],"a":"D","e":"S = πr² = π · 43² = 1849π."},{"id":10,"s":"area_volume","t":"total area of two circles","d":"m","q":"Circle N has a radius of 7 millimeters (mm). Circle M has an area of 64π mm². What is the total area, in mm², of circles N and M?","c":["113π","92π","78π","15π"],"a":"A","e":"S_N = π · 7² = 49π.\n49π + 64π = 113π."},{"id":12,"s":"area_volume","t":"volume of rectangular prism","d":"m","q":"What is the volume, in cubic centimeters, of a right rectangular prism that has a length of 4 centimeters, a width of 9 centimeters, and a height of 10 centimeters?","c":[],"a":"360","e":"V = 4 · 9 · 10 = 360."},{"id":13,"s":"area_volume","t":"cube minus inscribed sphere volume","d":"h","q":"A cube has an edge length of 68 inches. A solid sphere with a radius of 34 inches is inside the cube, such that the sphere touches the center of each face of the cube. To the nearest cubic inch, what is the volume of the space in the cube not taken up by the sphere?","c":["149,796","164,500","190,955","310,800"],"a":"A","e":"Куб: 68³ = 314 432.\nШар: (4/3)π · 34³ ≈ 164 636.\nРазность ≈ 149 796."},{"id":15,"s":"area_volume","t":"cylinder volume, find height","d":"m","q":"A right circular cylinder has a volume of 377 cubic centimeters. The area of the base of the cylinder is 13 square centimeters. What is the height, in centimeters, of the cylinder?","c":[],"a":"29","e":"V = S_осн · h → h = 377/13 = 29."},{"id":18,"s":"area_volume","t":"volume of cube","d":"m","q":"A cube has an edge length of 41 inches. What is the volume, in cubic inches, of the cube?","c":["164","1,681","10,086","68,921"],"a":"D","e":"V = 41³ = 68 921."},{"id":19,"s":"area_volume","t":"right square prism height from volume","d":"m","q":"The length of the edge of the base of a right square prism is 6 units. The volume of the prism is 2,880 cubic units. What is the height, in units, of the prism?","c":["4√30","36","24√5","80"],"a":"D","e":"Площадь основания 6² = 36.\nh = 2880/36 = 80."},{"id":20,"s":"area_volume","t":"cylinder volume from diameter","d":"m","q":"A cylinder has a diameter of 8 inches and a height of 12 inches. What is the volume, in cubic inches, of the cylinder?","c":["16π","96π","192π","768π"],"a":"C","e":"r = 8/2 = 4.\nV = π · 4² · 12 = 192π."},{"id":22,"s":"circles","t":"tangent line to circle, point on tangent line","d":"h","q":"A circle in the xy-plane has its center at (−1, 1). Line t is tangent to this circle at the point (5, −4). Which of the following points also lies on line t?","c":["(0, 6/5)","(4, 7)","(10, 2)","(11, 1)"],"a":"C","e":"Наклон радиуса: (−4 − 1)/(5 − (−1)) = −5/6.\nКасательная ⊥ радиусу → наклон 6/5.\nОт (5, −4): +5 по x, +6 по y → (10, 2)."},{"id":23,"s":"circles","t":"radii and triangle perimeter","d":"h","q":"Points Q and R lie on a circle with center P. The radius of this circle is 9 inches. Triangle PQR has a perimeter of 31 inches. What is the length, in inches, of QR?","c":["13√2","13","9√2","9"],"a":"B","e":"PQ = PR = 9 (радиусы).\nQR = 31 − 9 − 9 = 13."},{"id":24,"s":"circles","t":"circle equation, possible x-coordinate range","d":"m","q":"(x − 3)² + (y + 16)² = 289\nThe graph of the given equation is a circle in the xy-plane. The point (q, s) lies on the circle. Which of the following is NOT a possible value of q?","c":["−17","−3","3","17"],"a":"A","e":"Центр (3, −16), r = √289 = 17.\nx меняется от 3 − 17 = −14 до 3 + 17 = 20.\n−17 вне отрезка."},{"id":25,"s":"circles","t":"complete the square, find constant given radius","d":"h","q":"x² + x√t + y² − y − 65 = 0\nThe given equation, where t is a constant, defines a circle in the xy-plane. The radius of this circle is √83. What is the value of t?","c":["73","71","37","35"],"a":"B","e":"Выделяем квадраты: (x + √t/2)² + (y − 1/2)² = 65 + t/4 + 1/4.\nr² = 83 → t/4 = 83 − 65 − 1/4 = 17,75 → t = 71."},{"id":27,"s":"circles","t":"complete the square, find radius","d":"h","q":"The graph of x² + x + y² + y = 199/2 in the xy-plane is a circle. What is the length of the circle's radius?","c":[],"a":"10","e":"(x + 1/2)² + (y + 1/2)² = 199/2 + 1/4 + 1/4 = 100.\nr = 10."},{"id":28,"s":"circles","t":"unit circle, angle in radians","d":"h","q":"Point F lies on a unit circle in the xy-plane and has coordinates (1, 0). Point G is the center of the circle and has coordinates (0, 0). Point H also lies on the circle and has coordinates (−1, y), where y is a constant. Which of the following could be the positive measure of angle FGH, in radians?","c":["27π/2","29π/2","24π","25π"],"a":"D","e":"H на единичной окружности с x = −1 → H = (−1, 0), угол FGH = π.\nПодходят π + 2πk: 25π = π + 12 · 2π."},{"id":29,"s":"circles","t":"circle equation, possible x-coordinate","d":"m","q":"(x + 4)² + (y − 19)² = 121\nThe graph of the given equation is a circle in the xy-plane. The point (a, b) lies on the circle. Which of the following is a possible value for a?","c":["−16","−14","11","19"],"a":"B","e":"Центр (−4, 19), r = 11.\nx от −15 до 7 → подходит только −14."},{"id":30,"s":"circles","t":"center of circle by completing the square","d":"h","q":"x² + 20x + y² + 16y = −20\nThe equation above defines a circle in the xy-plane. What are the coordinates of the center of the circle?","c":["(−20, −16)","(−10, −8)","(10, 8)","(20, 16)"],"a":"B","e":"x² + 20x = (x + 10)² − 100, y² + 16y = (y + 8)² − 64.\nЦентр (−10, −8)."},{"id":32,"s":"circles","t":"circle with given diameter endpoints, find radius","d":"h","q":"A circle in the xy-plane has a diameter with endpoints (2, 4) and (2, 14). An equation of this circle is (x − 2)² + (y − 9)² = r², where r is a positive constant. What is the value of r?","c":[],"a":"5","e":"Диаметр от (2, 4) до (2, 14) = 10.\nr = 5."},{"id":33,"s":"circles","t":"concentric circle with doubled radius","d":"h","q":"Circle A in the xy-plane has the equation (x + 5)² + (y − 5)² = 25. Circle B has the same center as circle A. The radius of circle B is two times the radius of circle A. The equation defining circle B in the xy-plane is (x + 5)² + (y − 5)² = k, where k is a constant. What is the value of k?","c":[],"a":"100","e":"r_A = √25 = 5, r_B = 10.\nk = 10² = 100."},{"id":34,"s":"circles","t":"concentric circle with doubled radius","d":"h","q":"Circle A in the xy-plane has the equation (x + 5)² + (y − 5)² = 4. Circle B has the same center as circle A. The radius of circle B is two times the radius of circle A. The equation defining circle B in the xy-plane is (x + 5)² + (y − 5)² = k, where k is a constant. What is the value of k?","c":[],"a":"16","e":"r_A = √4 = 2, r_B = 4.\nk = 4² = 16."},{"id":35,"s":"circles","t":"diameter from circle equation","d":"h","q":"What is the diameter of the circle in the xy-plane with equation (x − 5)² + (y − 3)² = 16?","c":["4","8","16","32"],"a":"B","e":"r = √16 = 4, d = 2r = 8."},{"id":36,"s":"circles","t":"write circle equation from center and radius","d":"h","q":"A circle in the xy-plane has its center at (19, 18) and has a radius of 9k. Which equation represents this circle?","c":["(x − 19)² + (y − 18)² = 81k","(x − 19)² + (y − 18)² = 81k²","(x − 19)² + (y − 18)² = 9k","(x − 19)² + (y − 18)² = 9k²"],"a":"B","e":"Справа стоит r²: (9k)² = 81k²."},{"id":37,"s":"circles","t":"radius from circle equation","d":"m","q":"What is the radius of the circle in the xy-plane defined by (x + 2)² + (y + 5)² = 169?","c":[],"a":"13","e":"r = √169 = 13."},{"id":38,"s":"circles","t":"center and radius from equation with parameter","d":"m","q":"A circle in the xy-plane has the equation (x − 19)² + (y − 17)² = 64k², where k is a positive constant. Which of the following gives the center of the circle and its radius?","c":["The center is at (19, 17), and the radius is 8.","The center is at (19, 17), and the radius is 8k.","The center is at (19, 17), and the radius is 64.","The center is at (19, 17), and the radius is 64k."],"a":"B","e":"r = √(64k²) = 8k (k > 0)."},{"id":39,"s":"circles","t":"radius from circle equation","d":"m","q":"What is the radius of the circle in the xy-plane defined by (x + 3)² + (y + 5)² = 289?","c":[],"a":"17","e":"r = √289 = 17."},{"id":40,"s":"circles","t":"arc measure and central angle","d":"h","q":"Point O is the center of a circle. The measure of arc RS on this circle is 100°. What is the measure, in degrees, of its associated angle ROS?","c":[],"a":"100","e":"Центральный угол равен дуге: 100°."},{"id":41,"s":"equivalent_expressions","t":"factoring perfect square trinomial","d":"m","q":"4a² + 20ab + 25b²\nWhich of the following is a factor of the polynomial above?","c":["a + b","2a + 5b","4a + 5b","4a + 25b"],"a":"B","e":"4a² + 20ab + 25b² = (2a + 5b)²."},{"id":42,"s":"equivalent_expressions","t":"substituting and expanding polynomial expressions","d":"m","q":"If p = 3x + 4 and v = x + 5, which of the following is equivalent to pv − 2p + v?","c":["3x² + 12x + 7","3x² + 14x + 17","3x² + 19x + 20","3x² + 26x + 33"],"a":"B","e":"pv = (3x + 4)(x + 5) = 3x² + 19x + 20.\n−2p + v = −6x − 8 + x + 5 = −5x − 3.\nИтого 3x² + 14x + 17."},{"id":43,"s":"equivalent_expressions","t":"simplifying rational expression by common factor","d":"m","q":"Which expression is equivalent to (8x(x−7) − 3(x−7))/(2x−14), where x > 7?","c":["(x−7)/5","(8x−3)/2","(8x²−3x−14)/(2x−14)","(8x²−3x−77)/(2x−14)"],"a":"B","e":"Числитель: (x − 7)(8x − 3), знаменатель 2(x − 7).\nСокращаем: (8x − 3)/2."},{"id":44,"s":"equivalent_expressions","t":"factoring quartic as quadratic in x²","d":"m","q":"Which of the following is equivalent to the expression x⁴ − x² − 6?","c":["(x² + 1)(x² − 6)","(x² + 2)(x² − 3)","(x² + 3)(x² − 2)","(x² + 6)(x² − 1)"],"a":"B","e":"Пусть u = x²: u² − u − 6 = (u − 3)(u + 2).\nОтвет: (x² + 2)(x² − 3)."},{"id":45,"s":"equivalent_expressions","t":"expanding and combining polynomial expressions","d":"m","q":"(2x + 5)² − (x − 2) + 2(x + 3)\nWhich of the following is equivalent to the expression above?","c":["4x² + 21x + 33","4x² + 21x + 29","4x² + x + 29","4x² + x + 33"],"a":"A","e":"(2x + 5)² = 4x² + 20x + 25.\n−(x − 2) + 2(x + 3) = x + 8.\nИтого 4x² + 21x + 33."},{"id":46,"s":"equivalent_expressions","t":"equivalent polynomials, coefficient matching","d":"h","q":"(ax + 3)(5x² − bx + 4) = 20x³ − 9x² − 2x + 12\nThe equation above is true for all x, where a and b are constants. What is the value of ab?","c":["18","20","24","40"],"a":"C","e":"x³: 5a = 20 → a = 4.\nx²: −ab + 15 = −9 → ab = 24."},{"id":47,"s":"equivalent_expressions","t":"difference of squares factoring","d":"m","q":"Which of the following expressions is equivalent to x² − 5?","c":["(x + √5)²","(x − √5)²","(x + √5)(x − √5)","(x + 5)(x − 1)"],"a":"C","e":"Разность квадратов: x² − (√5)² = (x + √5)(x − √5)."},{"id":48,"s":"equivalent_expressions","t":"factors of quadratic with leading coefficient","d":"h","q":"Which of the following expressions is(are) a factor of 3x² + 20x − 63?\nI. x − 9\nII. 3x − 7","c":["I only","II only","I and II","Neither I nor II"],"a":"B","e":"3x² + 20x − 63 = (3x − 7)(x + 9).\nx − 9 не множитель → только II."},{"id":49,"s":"equivalent_expressions","t":"rational exponents and radicals","d":"h","q":"If √(x⁵) / ∛(x⁴) = x^(a/b) for all positive values of x, what is the value of a/b?","c":[],"a":"7/6","e":"x^(5/2) : x^(4/3) = x^(15/6 − 8/6) = x^(7/6)."},{"id":50,"s":"equivalent_expressions","t":"factoring out greatest common factor","d":"m","q":"Which of the following expressions is equivalent to 8x¹⁰ − 8x⁹ + 88x?","c":["x(7x¹⁰ − 7x⁹ + 87x)","x(8¹⁰ − 8⁹ + 88)","8x(x¹⁰ − x⁹ + 11x)","8x(x⁹ − x⁸ + 11)"],"a":"D","e":"Выносим 8x: 8x(x⁹ − x⁸ + 11)."},{"id":51,"s":"equivalent_expressions","t":"adding rational expressions, solving for constant","d":"h","q":"The expression (29x + 102)/(x(x + 51)) is equivalent to p/x + w/(x + 51), where p and w are constants. What is the value of w?","c":[],"a":"27","e":"29x + 102 = p(x + 51) + wx.\nx = 0: 102 = 51p → p = 2.\nКоэффициенты при x: p + w = 29 → w = 27."},{"id":52,"s":"equivalent_expressions","t":"factoring out common factor, find constant","d":"m","q":"The expression 90y⁵ − 54y⁴ is equivalent to ry⁴(15y − 9), where r is a constant. What is the value of r?","c":[],"a":"6","e":"90y⁵ − 54y⁴ = 6y⁴(15y − 9) → r = 6."},{"id":53,"s":"equivalent_expressions","t":"adding rational expressions, find product of constants","d":"h","q":"2/(x−2) + 3/(x+5) = (rx + t)/((x−2)(x+5))\nThe equation above is true for all x > 2, where r and t are positive constants. What is the value of rt?","c":["−20","15","20","60"],"a":"C","e":"2(x + 5) + 3(x − 2) = 5x + 4.\nr = 5, t = 4, rt = 20."},{"id":54,"s":"equivalent_expressions","t":"expanding squared binomial with decimals","d":"m","q":"Which of the following is an equivalent form of (1.5x − 2.4)² − (5.2x² − 6.4)?","c":["−2.2x² + 1.6","−2.2x² + 11.2","−2.95x² − 7.2x + 12.16","−2.95x² − 7.2x + 0.64"],"a":"C","e":"(1.5x − 2.4)² = 2.25x² − 7.2x + 5.76.\nМинус (5.2x² − 6.4): −2.95x² − 7.2x + 12.16."},{"id":55,"s":"equivalent_expressions","t":"rational exponents with radicals","d":"h","q":"[Expression: ⁵√(70n) · (⁶√(70n))²] For what value of x is the given expression equivalent to (70n)³⁰ˣ, where n > 1?","c":[],"a":"4/225","e":"(70n)^(1/5) · (70n)^(2/6) = (70n)^(1/5 + 1/3) = (70n)^(8/15).\n30x = 8/15 → x = 8/450 = 4/225."},{"id":56,"s":"equivalent_expressions","t":"expanding product of binomials, find coefficient","d":"h","q":"The expression (3x − 23)(19x + 6) is equivalent to the expression ax² + bx + c, where a, b, and c are constants. What is the value of b?","c":[],"a":"-419","e":"b = 3 · 6 + (−23) · 19 = 18 − 437 = −419."},{"id":57,"s":"equivalent_expressions","t":"subtracting rational expressions","d":"h","q":"Which expression is equivalent to 4/(4x−5) − 1/(x+1)?","c":["1/((x+1)(4x−5))","3/(3x−6)","−1/((x+1)(4x−5))","9/((x+1)(4x−5))"],"a":"D","e":"Общий знаменатель (x + 1)(4x − 5).\n4(x + 1) − (4x − 5) = 9.\nОтвет: 9/((x + 1)(4x − 5))."},{"id":58,"s":"equivalent_expressions","t":"difference of squares in rational expression","d":"h","q":"(x² − c)/(x − b)\nIn the expression above, b and c are positive integers. If the expression is equivalent to x + b and x ≠ b, which of the following could be the value of c?","c":["4","6","8","10"],"a":"A","e":"x² − c = (x − b)(x + b) = x² − b² → c = b².\nПолный квадрат из вариантов: 4."},{"id":59,"s":"equivalent_expressions","t":"product of linear functions","d":"m","q":"g(x) = (3/5)x + 7/6\nh(x) = 6x − 5\nThe functions g and h are defined by the equations shown. Which expression is equivalent to g(x) · h(x)?","c":["18x²/5 − 35/6","18x²/5 + 27x/11 − 35/6","18x²/5 − 4x − 35/6","18x²/5 + 4x − 35/6"],"a":"D","e":"(3/5)x · 6x = 18x²/5.\nx: −3x + 7x = 4x.\nСвободный: (7/6)(−5) = −35/6."},{"id":60,"s":"equivalent_expressions","t":"cube root properties of radicals","d":"m","q":"∛(x³y⁶)\nWhich of the following expressions is equivalent to the expression above?","c":["y²","xy²","y³","xy³"],"a":"B","e":"∛(x³) = x, ∛(y⁶) = y² → xy²."},{"id":62,"s":"inference","t":"finding margin of error from interval","d":"m","q":"Researchers studied a sample of a species of fish from a certain location. The researchers found that the mean length of fish in the sample was 16.59 millimeters. Based on the sample mean and margin of error, the researchers estimated that the mean length of all fish of this species from this location was between 15.86 and 17.32 millimeters. What is the margin of error, in millimeters?","c":["0.73","2.19","15.86","16.59"],"a":"A","e":"Погрешность = половина интервала: (17.32 − 15.86)/2 = 0.73."},{"id":63,"s":"inference","t":"generalizing sample results to the correct population","d":"m","q":"A study was done on the weights of different types of fish in a pond. A random sample of fish were caught and marked in order to ensure that none were weighed more than once. The sample contained 150 largemouth bass, of which 30% weighed more than 2 pounds. Which of the following conclusions is best supported by the sample data?","c":["The majority of all fish in the pond weigh less than 2 pounds.","The average weight of all fish in the pond is approximately 2 pounds.","Approximately 30% of all fish in the pond weigh more than 2 pounds.","Approximately 30% of all largemouth bass in the pond weigh more than 2 pounds."],"a":"D","e":"В выборке только largemouth bass → вывод только про них."},{"id":64,"s":"inference","t":"interpreting mean estimate with margin of error","d":"m","q":"A park ranger asked a random sample of visitors how far they hiked during their visit. Based on the responses, the estimated mean was found to be 4.5 miles, with an associated margin of error of 0.5 miles. Which of the following is the best conclusion from these data?","c":["It is likely that all visitors hiked between 4 and 5 miles.","It is likely that most visitors hiked exactly 4.5 miles.","It is not possible that any visitor hiked less than 3 miles.","It is plausible that the mean distance hiked for all visitors is between 4 and 5 miles."],"a":"D","e":"Погрешность относится к среднему, а не к каждому человеку.\n4.5 ± 0.5 → среднее, скорее всего, от 4 до 5."},{"id":65,"s":"inference","t":"plausible interval from percent estimate and margin of error","d":"m","q":"A sample consisting of 720 adults who own televisions was selected at random for a study. Based on the sample, it is estimated that 32% of all adults who own televisions use their televisions to watch nature shows, with an associated margin of error of 3.41%. Which of the following is the most plausible conclusion about all adults who own televisions?","c":["More than 35.41% of all adults who own televisions use their televisions to watch nature shows.","Between 28.59% and 35.41% of all adults who own televisions use their televisions to watch nature shows.","Since the sample included adults who own televisions and not just those who use their televisions to watch nature shows, no conclusion can be made.","Since the sample did not include all the people who watch nature shows, no conclusion can be made."],"a":"B","e":"32% ± 3.41% → от 28.59% до 35.41%."},{"id":66,"s":"inference","t":"interpreting mean estimate with margin of error","d":"m","q":"A company fills boxes with approximately 23 pounds of oranges. To test the accuracy of the filling process, 344 boxes of oranges were selected at random and weighed. Based on the sample, it is estimated that the average weight of all boxes of oranges filled by the company in an 8-hour period is 23.1 pounds, with an associated margin of error of 0.19 pounds. Which of the following is the best interpretation of this estimate?","c":["Plausible values for the average weight of all boxes of oranges filled by the company are between 22.91 pounds and 23.29 pounds.","Plausible values for the average weight of all boxes of oranges filled by the company are less than 22.91 pounds or greater than 23.29 pounds.","The average weight of all boxes of oranges filled by the company is less than 23.01 pounds.","The average weight of all boxes of oranges filled by the company is greater than 23.01 pounds."],"a":"A","e":"23.1 ± 0.19 → от 22.91 до 23.29."},{"id":67,"s":"inference","t":"plausible interval from percent estimate and margin of error","d":"m","q":"A company that produces socks wants to estimate the percent of the socks produced in a typical week that are defective. A random sample of 310 socks produced in a certain week were inspected. Based on the sample, it is estimated that 12% of all socks produced by the company in this week are defective, with an associated margin of error of 3.62%. Based on the estimate and associated margin of error, which of the following is the most appropriate conclusion about all socks produced by the company during this week?","c":["3.62% of the socks are defective.","It is plausible that between 8.38% and 15.62% of the socks are defective.","12% of the socks are defective.","It is plausible that more than 15.62% of the socks are defective."],"a":"B","e":"12% ± 3.62% → от 8.38% до 15.62%."},{"id":68,"s":"inference","t":"finding margin of error from interval","d":"m","q":"A middle school faculty surveyed students to determine interest in an after-school chess club. Of the 100 students who were selected at random from all students in the school, 32% expressed interest in the club. Based on the sample mean and the margin of error, the faculty expects that between 24% and 40% of all students in the school would express interest in the club. What is the margin of error?","c":["0%","8%","16%","32%"],"a":"B","e":"(40 − 24)/2 = 8%."},{"id":69,"s":"inference","t":"margin of error applied to count in population","d":"m","q":"A bag containing 10,000 beads of assorted colors is purchased from a craft store. To estimate the percent of red beads in the bag, a sample of beads is selected at random. The percent of red beads in the bag was estimated to be 15%, with an associated margin of error of 2%. If r is the actual number of red beads in the bag, which of the following is most plausible?","c":["r > 1,700","1,300 < r < 1,700","200 < r < 1,500","r < 1,300"],"a":"B","e":"15% ± 2% → от 13% до 17% от 10 000.\n1300 < r < 1700."},{"id":71,"s":"inference","t":"margin of error applied to population count","d":"m","q":"From a population of 50,000 people, 1,000 were chosen at random and surveyed about a proposed piece of legislation. Based on the survey, it is estimated that 35% of people in the population support the legislation, with an associated margin of error of 3%. Based on these results, which of the following is a plausible value for the total number of people in the population who support the proposed legislation?","c":["350","650","16,750","31,750"],"a":"C","e":"35% ± 3% → от 32% до 38% от 50 000 = от 16 000 до 19 000.\nПодходит 16 750."},{"id":72,"s":"inference","t":"effect of sample size on margin of error","d":"m","q":"A researcher is designing a study to investigate the average number of hours participants in a training course spend on a particular activity per day. The researcher will report an estimated average number of hours participants in the training course spend on this activity per day with an associated margin of error. The researcher is considering using a random sample of either 115 or 230 participants from the training course. Which of the following would be the most likely effect of using the larger random sample compared to the smaller random sample?","c":["The reported margin of error would be lower.","The reported margin of error would be higher.","The reported average number of hours would be lower.","The reported average number of hours would be higher."],"a":"A","e":"Больше выборка → меньше погрешность."},{"id":73,"s":"inference","t":"interpreting mean estimate with margin of error","d":"m","q":"Based on a random sample from a population, a researcher estimated that the mean value of a certain variable for the population is 20.5, with an associated margin of error of 1. Which of the following is the most appropriate conclusion?","c":["It is plausible that the actual mean value of the variable for the population is between 19.5 and 21.5.","It is not possible that the mean value of the variable for the population is less than 19.5 or greater than 21.5.","Every value of the variable in the population is between 19.5 and 21.5.","The mean value of the variable for the population is 20.5."],"a":"A","e":"Погрешность даёт правдоподобный интервал для среднего: 20.5 ± 1 → от 19.5 до 21.5."},{"id":74,"s":"inference","t":"effect of larger sample size on margin of error","d":"h","q":"A researcher surveyed a random sample of 1,020 people from a certain city to estimate the percentage of people who support a recently announced proposal. From the survey, the researcher estimated that 86% of people from the city support this proposal, with an associated margin of error of 2.13%. The researcher repeated the survey with a random sample of people from the city that was double the original sample size. Assuming the margins of error were calculated in the same way, which of the following is true about the margin of error associated with the estimate from the larger sample?","c":["The margin of error is between 2.13% and 3.13%.","The margin of error is between 4.13% and 5.13%.","The margin of error is greater than 5.13%.","The margin of error is less than 2.13%."],"a":"D","e":"Выборка вдвое больше → погрешность меньше 2.13%."},{"id":75,"s":"inference","t":"estimating population count from sample percent","d":"h","q":"In State X, Mr. Camp's eighth-grade class consisting of 26 students was surveyed and 34.6 percent of the students reported that they had at least two siblings. The average eighth-grade class size in the state is 26. If the students in Mr. Camp's class are representative of students in the state's eighth-grade classes and there are 1,800 eighth-grade classes in the state, which of the following best estimates the number of eighth-grade students in the state who have fewer than two siblings?","c":["16,200","23,400","30,600","46,800"],"a":"C","e":"Меньше двух братьев/сестёр: 100% − 34.6% = 65.4%.\nУчеников: 26 · 1800 = 46 800.\n0.654 · 46 800 ≈ 30 600."},{"id":76,"s":"inference","t":"estimating population count from random sample","d":"m","q":"A store manager reviewed the receipts from 80 customers who were selected at random from all the customers who made purchases last Thursday. Of those selected, 20 receipts showed that the customer had purchased fruit. If 1,500 customers made purchases last Thursday, which of the following is the most appropriate conclusion?","c":["Exactly 75 customers must have purchased fruit last Thursday.","Exactly 375 customers must have purchased fruit last Thursday.","The best estimate for the number of customers who purchased fruit last Thursday is 75.","The best estimate for the number of customers who purchased fruit last Thursday is 375."],"a":"D","e":"Доля: 20/80 = 1/4.\n1/4 · 1500 = 375 — это оценка, а не «точно»."},{"id":79,"s":"linear_eq_1var","t":"solving linear equation with repeated binomial","d":"h","q":"5(t + 3) − 7(t + 3) = 38\nWhat value of t is the solution to the given equation?","c":[],"a":"-22","e":"5(t + 3) − 7(t + 3) = −2(t + 3) = 38.\nt + 3 = −19 → t = −22."},{"id":80,"s":"linear_eq_1var","t":"number of solutions of a linear equation","d":"h","q":"How many solutions does the equation 12(x − 3) = −3(x + 12) have?","c":["Exactly one","Exactly two","Infinitely many","Zero"],"a":"A","e":"12x − 36 = −3x − 36 → 15x = 0 → x = 0.\nОдно решение."},{"id":81,"s":"linear_eq_1var","t":"value of expression from equation","d":"m","q":"If 5(x + 4) = 4(x + 4) + 29, what is the value of x + 4?","c":["−4","25","29","33"],"a":"C","e":"Пусть u = x + 4: 5u = 4u + 29 → u = 29.\nРаскрывать скобки не нужно."},{"id":82,"s":"linear_eq_1var","t":"solving linear equation with distribution","d":"m","q":"2(p + 1) + 8(p − 1) = 5p\nWhat value of p is the solution of the equation above?","c":[],"a":"1.2","e":"2p + 2 + 8p − 8 = 5p → 10p − 6 = 5p.\n5p = 6 → p = 1.2."},{"id":83,"s":"linear_eq_1var","t":"writing linear equation from word problem (polygon sides)","d":"h","q":"Each side of a 30-sided polygon has one of three lengths. The number of sides with length 8 centimeters (cm) is 5 times the number of sides n with length 3 cm. There are 6 sides with length 4 cm. Which equation must be true for the value of n?","c":["5n + 6 = 30","6n + 6 = 30","8n + 3n + 4n = 30","8(5n) + 3n + 4(6) = 30"],"a":"B","e":"Сторон по 3 см — n, по 8 см — 5n, по 4 см — 6.\nn + 5n + 6 = 30 → 6n + 6 = 30."},{"id":84,"s":"linear_eq_1var","t":"value of expression from equation with fractions","d":"m","q":"If 4x − 1/2 = −5, what is the value of 8x − 1?","c":["2","−9/8","−5/2","−10"],"a":"D","e":"8x − 1 = 2(4x − 1/2) = 2 · (−5) = −10."},{"id":85,"s":"linear_eq_1var","t":"profit equation word problem","d":"m","q":"A museum rents tablets to visitors. The museum earns revenue of $14 for each tablet rented for the day. On Wednesday, the museum earned $406 in profit from renting tablets after paying daily expenses of $112. How many tablets did the museum rent on Wednesday? (profit = total revenue − total expenses)","c":[],"a":"37","e":"Прибыль: 14n − 112 = 406.\n14n = 518 → n = 37."},{"id":86,"s":"linear_eq_1var","t":"no solution, find constant","d":"h","q":"−3x + 21px = 84\nIn the given equation, p is a constant. The equation has no solution. What is the value of p?","c":["0","1/7","4/3","4"],"a":"B","e":"x(21p − 3) = 84. Нет решений, если 21p − 3 = 0.\np = 3/21 = 1/7."},{"id":87,"s":"linear_eq_1var","t":"value of expression from equation","d":"m","q":"If 2(3t − 10) + t = 40 + 4t, what is the value of 3t?","c":[],"a":"60","e":"6t − 20 + t = 40 + 4t → 3t = 60.\nСпрашивают 3t — сразу ответ."},{"id":88,"s":"linear_eq_1var","t":"equation with equal fractions, value of expression","d":"h","q":"If (x + 6)/3 = (x + 6)/13, the value of x + 6 is between which of the following pairs of values?","c":["−7 and −3","−2 and 2","2 and 7","8 and 13"],"a":"B","e":"Дробь с разными знаменателями равна, только если x + 6 = 0.\n0 между −2 и 2."},{"id":89,"s":"linear_eq_1var","t":"writing linear equation from rental cost word problem","d":"m","q":"The cost to rent a commercial fishing boat from a certain company is $950 for the first 2 hours and an additional $50 per hour for each hour after the first 2 hours. If the total cost to rent the commercial fishing boat from the company for t hours, where t > 2, is $1,100, which equation represents this situation?","c":["950(t − 2) + 50t = 1,100","950(2t) + 50t = 1,100","950 + 50(t − 2) = 1,100","950 + 50(2t) = 1,100"],"a":"C","e":"$950 за первые 2 часа + $50 за каждый следующий: 950 + 50(t − 2) = 1100."},{"id":90,"s":"linear_eq_1var","t":"writing linear equation from rental cost word problem","d":"m","q":"The cost to rent a bus from Company X is $950 for the first 3 hours and an additional $50 per hour for each hour after the first 3 hours. If the total cost to rent the bus from Company X for t hours, where t > 3, is $1,150, which equation represents this situation?","c":["950(t − 3) + 50t = 1,150","950(3t) + 50t = 1,150","950 + 50(t − 3) = 1,150","950 + 50(3t) = 1,150"],"a":"C","e":"$950 за первые 3 часа + $50 за каждый следующий: 950 + 50(t − 3) = 1150."},{"id":91,"s":"linear_eq_1var","t":"value of expression from equation with fraction coefficient","d":"m","q":"If (6/7)p + 18 = 54, what is the value of 7p?","c":[],"a":"294","e":"(6/7)p = 36 → p = 42.\n7p = 294."},{"id":92,"s":"linear_eq_1var","t":"number of solutions of a linear equation","d":"h","q":"−49x = −98x\nHow many solutions does the given equation have?","c":["Zero","Exactly one","Exactly two","Infinitely many"],"a":"B","e":"−49x = −98x → 49x = 0 → x = 0.\nОдно решение (ловушка: «0 — значит нет решений»)."},{"id":93,"s":"linear_eq_1var","t":"wage word problem with overtime","d":"m","q":"Megan’s regular wage at her job is p dollars per hour for the first 8 hours of work in a day plus 1.5 times her regular hourly wage for work in excess of 8 hours that day. On a given day, Megan worked for 10 hours, and her total earnings for that day were $137.50. What is Megan’s regular hourly wage?","c":["$11.75","$12.50","$13.25","$13.75"],"a":"B","e":"8 часов по p + 2 часа по 1.5p = 11p.\n11p = 137.50 → p = 12.50."},{"id":94,"s":"linear_eq_1var","t":"rate word problem solving for time","d":"m","q":"A bowl contains 20 ounces of water. When the bowl is uncovered, the amount of water in the bowl decreases by 1 ounce every 4 days. If 9 ounces of water remain in this bowl, for how many days has it been uncovered?","c":["3","7","36","44"],"a":"D","e":"Испарилось 20 − 9 = 11 унций, по 4 дня на унцию.\n11 · 4 = 44."},{"id":95,"s":"linear_eq_1var","t":"value of expression from equation","d":"h","q":"If 5 − 7(2 − 4x) = 16 − 8(2 − 4x), what is the value of 2 − 4x?","c":[],"a":"11","e":"Пусть u = 2 − 4x: 5 − 7u = 16 − 8u → u = 11."},{"id":96,"s":"linear_eq_1var","t":"number of solutions of a linear equation","d":"m","q":"66x = 66x\nHow many solutions does the given equation have?","c":["Exactly one","Exactly two","Infinitely many","Zero"],"a":"C","e":"Обе части одинаковые → верно при любом x.\nБесконечно много решений."},{"id":97,"s":"linear_eq_1var","t":"infinitely many solutions, find constant","d":"m","q":"4x + 12 = a(x + 3)/2\nIn the given equation, a is a constant. If the equation has infinitely many solutions, what is the value of a?","c":["0","3","8","12"],"a":"C","e":"Нужно a/2 · (x + 3) = 4(x + 3) → a/2 = 4 → a = 8."},{"id":98,"s":"linear_eq_1var","t":"no solution conditions on constants","d":"h","q":"The equation 9x + 5 = a(x + b), where a and b are constants, has no solutions. Which of the following must be true?\nI. a = 9\nII. b = 5\nIII. b ≠ 5/9","c":["None","I only","I and II only","I and III only"],"a":"D","e":"a(x + b) = ax + ab. Нет решений: наклоны равны, свободные нет.\na = 9 и 9b ≠ 5 → b ≠ 5/9. Верны I и III."},{"id":99,"s":"linear_eq_2var","t":"interpreting terms of a linear equation in context","d":"h","q":"Keenan made 32 cups of vegetable broth. Keenan then filled x small jars and y large jars with all the vegetable broth he made. The equation 3x + 5y = 32 represents this situation. Which is the best interpretation of 5y in this context?","c":["The number of large jars Keenan filled","The number of small jars Keenan filled","The total number of cups of vegetable broth in the large jars","The total number of cups of vegetable broth in the small jars"],"a":"C","e":"5 — чашек в одной большой банке, y — число больших банок.\n5y — всего чашек в больших банках."},{"id":104,"s":"linear_eq_2var","t":"intercepts of a line, ratio of intercept coordinates","d":"h","q":"The graph of 7x + 2y = −31 in the xy-plane has an x-intercept at (a, 0) and a y-intercept at (0, b), where a and b are constants. What is the value of b/a?","c":["−7/2","−2/7","2/7","7/2"],"a":"D","e":"y = 0: x = a = −31/7. x = 0: y = b = −31/2.\nb/a = (31/2) : (31/7) = 7/2."},{"id":106,"s":"linear_eq_2var","t":"interpreting terms of a linear equation in context","d":"m","q":"Lily made 36 cups of jam. Lily then filled x small containers and y large containers with all the jam she made. The equation 4x + 6y = 36 represents this situation. Which is the best interpretation of 6y in this context?","c":["The number of large containers Lily filled","The number of small containers Lily filled","The total number of cups of jam in the large containers","The total number of cups of jam in the small containers"],"a":"C","e":"6 — чашек в одной большой банке, y — число больших.\n6y — всего джема в больших."},{"id":107,"s":"linear_eq_2var","t":"linear equation in context, solve for unknown amount","d":"m","q":"A batch of banana milkshakes consists of 4 cups of ice cream and 2 bananas and has 1,114 milligrams (mg) of calcium. There is 276 mg of calcium in 1 cup of the ice cream used to make this batch of milkshakes. How much calcium, in mg, is in 1 banana?","c":["5","10","419","1,104"],"a":"A","e":"Мороженое: 4 · 276 = 1104 мг.\n2 банана: 1114 − 1104 = 10 → 1 банан = 5."},{"id":109,"s":"linear_eq_2var","t":"slope of a line perpendicular to a vertical line","d":"h","q":"Line ℓ in the xy-plane is perpendicular to the line with equation x = 2. What is the slope of line ℓ?","c":["0","−1/2","−2","The slope of line ℓ is undefined."],"a":"A","e":"x = 2 — вертикальная прямая.\nПерпендикуляр — горизонтальная, наклон 0."},{"id":110,"s":"linear_eq_2var","t":"slope of a perpendicular line","d":"m","q":"Line k is defined by y = 7x + 1/8. Line j is perpendicular to line k in the xy-plane. What is the slope of line j?","c":["−8","−1/7","1/8","7"],"a":"B","e":"Наклон k = 7 → перпендикуляр: −1/7."},{"id":111,"s":"linear_eq_2var","t":"linear equation word problem, calories","d":"m","q":"In an article about exercise, it is estimated that a 160-pound adult uses 200 calories for every 30 minutes of hiking and 150 calories for every 30 minutes of bicycling. An adult who weighs 160 pounds has completed 1 hour of bicycling. Based on the article, how many hours should the adult hike to use a total of 1,900 calories from bicycling and hiking?","c":["9.5","8.75","6","4"],"a":"D","e":"Велосипед 1 ч = 2 · 150 = 300 кал.\nОсталось 1600, ходьба 400 кал/ч → 4 ч."},{"id":112,"s":"linear_eq_2var","t":"writing a linear equation from perimeters","d":"m","q":"A total of 2 squares each have side length r. A total of 6 equilateral triangles each have side length t. None of these squares and triangles shares a side. The sum of the perimeters of all these squares and triangles is 210. Which equation represents this situation?","c":["6r + 24t = 210","2r + 6t = 210","8r + 18t = 210","6r + 2t = 210"],"a":"C","e":"Квадраты: 2 · 4r = 8r. Треугольники: 6 · 3t = 18t.\n8r + 18t = 210."},{"id":113,"s":"linear_eq_2var","t":"translation of a line, x-intercept","d":"h","q":"The graph of 9x − 10y = 19 is translated down 4 units in the xy-plane. What is the x-coordinate of the x-intercept of the resulting graph?","c":[],"a":"59/9, 6.555, 6.556","e":"Сдвиг вниз на 4: y → y + 4.\n9x − 10(y + 4) = 19, при y = 0: 9x = 59 → x = 59/9."},{"id":114,"s":"linear_eq_2var","t":"slope from intercepts","d":"m","q":"When line n is graphed in the xy-plane, it has an x-intercept of (−4, 0) and a y-intercept of (0, 86/3). What is the slope of line n?","c":["3/344","6/43","43/6","344/3"],"a":"C","e":"Подъём 86/3 на пробег 4: наклон = 86/12 = 43/6."},{"id":115,"s":"linear_eq_2var","t":"equation of a line through two points","d":"m","q":"In the xy-plane, line k passes through the points (0, −5) and (1, −1). Which equation defines line k?","c":["y = −x + 1/4","y = (1/4)x − 5","y = −x + 4","y = 4x − 5"],"a":"D","e":"Наклон: (−1 − (−5))/1 = 4, пересечение с y: −5.\ny = 4x − 5."},{"id":118,"s":"linear_eq_2var","t":"slope of a perpendicular line from standard form with fractions","d":"h","q":"Line h is defined by (1/5)x + (1/7)y − 70 = 0. Line j is perpendicular to line h in the xy-plane. What is the slope of line j?","c":["−7/5","−5/7","7/5","5/7"],"a":"D","e":"Наклон h: −(1/5)/(1/7) = −7/5.\nПерпендикуляр: 5/7."},{"id":119,"s":"linear_functions","t":"find constant given function value","d":"m","q":"f(x) = 4x + b\nFor the linear function f, b is a constant and f(7) = 28. What is the value of b?","c":["0","1","4","7"],"a":"A","e":"f(7) = 28 + b = 28 → b = 0."},{"id":120,"s":"linear_functions","t":"write linear function from word problem (fixed charge plus hourly fee)","d":"h","q":"A window repair specialist charges $220 for the first two hours of repair plus an hourly fee for each additional hour. The total cost for 5 hours of repair is $400. Which function f gives the total cost, in dollars, for x hours of repair, where x ≥ 2?","c":["f(x) = 60x + 100","f(x) = 60x + 220","f(x) = 80x","f(x) = 80x + 220"],"a":"A","e":"3 доп. часа = 400 − 220 = 180 → $60/час.\nf(x) = 220 + 60(x − 2) = 60x + 100."},{"id":121,"s":"linear_functions","t":"x- and y-intercepts of a linear function","d":"m","q":"The function h is defined by h(x) = 4x + 28. The graph of y = h(x) in the xy-plane has an x-intercept at (a, 0) and a y-intercept at (0, b), where a and b are constants. What is the value of a + b?","c":["21","28","32","35"],"a":"A","e":"y = 0: x = −7 → a = −7. b = h(0) = 28.\na + b = 21."},{"id":122,"s":"linear_functions","t":"linear model from two data points, prediction","d":"h","q":"An economist modeled the demand Q for a certain product as a linear function of the selling price P. The demand was 20,000 units when the selling price was $40 per unit, and the demand was 15,000 units when the selling price was $60 per unit. Based on the model, what is the demand, in units, when the selling price is $55 per unit?","c":["16,250","16,500","16,750","17,500"],"a":"A","e":"Наклон: −5000/20 = −250 за доллар.\nОт $60 к $55: +1250 → 16 250."},{"id":124,"s":"linear_functions","t":"write linear equation for rental cost (first day plus additional days)","d":"h","q":"The cost of renting a backhoe for up to 10 days is $270 for the first day and $135 for each additional day. Which of the following equations gives the cost y, in dollars, of renting the backhoe for x days, where x is a positive integer and x ≤ 10?","c":["y = 270x − 135","y = 270x + 135","y = 135x + 270","y = 135x + 135"],"a":"D","e":"y = 270 + 135(x − 1) = 135x + 135."},{"id":125,"s":"linear_functions","t":"evaluate linear model from verbal description","d":"m","q":"According to a model, the head width, in millimeters, of a worker bumblebee can be estimated by adding 0.6 to four times the body weight of the bee, in grams. According to the model, what would be the head width, in millimeters, of a worker bumblebee that has a body weight of 0.5 grams?","c":[],"a":"2.6","e":"4 · 0.5 + 0.6 = 2.6."},{"id":127,"s":"linear_functions","t":"find constant then evaluate function","d":"m","q":"The function f is defined by f(x) = 4x + k(x − 1), where k is a constant, and f(5) = 32. What is the value of f(10)?","c":[],"a":"67","e":"f(5) = 20 + 4k = 32 → k = 3.\nf(10) = 40 + 3 · 9 = 67."},{"id":129,"s":"linear_functions","t":"interpret function value in context","d":"m","q":"The owner of a bakery is giving away free muffins every hour. The equation f(x) = 108 − 9x gives the number of free muffins, f(x), that remain to be given away after x hours. Which of the following is the best interpretation of f(12) = 0 in this context?","c":["The owner of the bakery has 12 free muffins to give away.","The owner of the bakery will give away 12 free muffins in 9 hours.","It will take 12 hours to give away all the free muffins.","It will take 108 hours to give away 12 free muffins."],"a":"C","e":"f(12) = 0: через 12 часов маффинов не останется."},{"id":130,"s":"linear_functions","t":"linear function from two points","d":"m","q":"In the xy-plane, the graph of the linear function f contains the points (0, 3) and (7, 31). Which equation defines f, where y = f(x)?","c":["f(x) = 28x + 34","f(x) = 3x + 38","f(x) = 4x + 3","f(x) = 7x + 3"],"a":"C","e":"Наклон: (31 − 3)/7 = 4, f(0) = 3.\nf(x) = 4x + 3."},{"id":131,"s":"linear_functions","t":"identify parameter of linear model in context","d":"m","q":"A model predicts that a certain animal weighed 241 pounds when it was born and that the animal gained 3 pounds per day in its first year of life. This model is defined by an equation in the form f(x) = a + bx, where f(x) is the predicted weight, in pounds, of the animal x days after it was born, and a and b are constants. What is the value of a?","c":[],"a":"241","e":"a — значение при x = 0, т.е. вес при рождении: 241."},{"id":132,"s":"linear_functions","t":"interpret x-intercept in context","d":"m","q":"A team of workers has been moving cargo off of a ship. The equation below models the approximate number of tons of cargo, y, that remains to be moved x hours after the team started working.\ny = 120 − 25x\nThe graph of this equation in the xy-plane is a line. What is the best interpretation of the x-intercept in this context?","c":["The team will have moved all the cargo in about 4.8 hours.","The team has been moving about 4.8 tons of cargo per hour.","The team has been moving about 25 tons of cargo per hour.","The team started with 120 tons of cargo to move."],"a":"A","e":"y = 0: 25x = 120 → x = 4.8.\nЧерез 4.8 часа груз весь перенесён."},{"id":133,"s":"linear_functions","t":"linear function from two function values","d":"m","q":"For the linear function h, h(0) = 0 and h(11) = 10. Which equation defines h?","c":["h(x) = (10/11)x","h(x) = (10/11)x + 10","h(x) = (11/10)x","h(x) = (11/10)x + 11"],"a":"A","e":"Наклон: 10/11, h(0) = 0 → h(x) = (10/11)x."},{"id":134,"s":"linear_functions","t":"x-intercept from slope and y-intercept","d":"m","q":"In the xy-plane, line k has a slope of 5 and a y-intercept of (0, −35). What is the x-coordinate of the x-intercept of line k?","c":[],"a":"7","e":"5x − 35 = 0 → x = 7."},{"id":135,"s":"linear_functions","t":"rate of change of temperature conversion function","d":"h","q":"F(x) = (9/5)(x − 273.15) + 32\nThe function F gives the temperature, in degrees Fahrenheit, that corresponds to a temperature of x kelvins. If a temperature increased by 9.10 kelvins, by how much did the temperature increase, in degrees Fahrenheit?","c":["16.38","48.38","475.29","507.29"],"a":"A","e":"Важен только наклон: 9/5 · 9.10 = 16.38."},{"id":136,"s":"linear_functions","t":"linear model in context (pressure vs depth)","d":"m","q":"The pressure exerted on a scuba diver at sea level is 14.70 pounds per square inch (psi). For each foot the scuba diver descends below sea level, the pressure exerted on the scuba diver increases by 0.44 psi. What is the total pressure, in psi, exerted on the scuba diver at 105 feet below sea level?","c":["60.90","31.50","14.70","0.44"],"a":"A","e":"14.70 + 0.44 · 105 = 14.70 + 46.20 = 60.90."},{"id":137,"s":"linear_functions","t":"x-intercept of linear function","d":"m","q":"The function f is defined by f(x) = 7x − 84. What is the x-intercept of the graph of y = f(x) in the xy-plane?","c":["(−12, 0)","(−7, 0)","(7, 0)","(12, 0)"],"a":"D","e":"7x − 84 = 0 → x = 12 → (12, 0)."},{"id":139,"s":"linear_inequalities","t":"system of inequalities, maximize item count","d":"m","q":"A cargo helicopter delivers only 100-pound packages and 120-pound packages. For each delivery trip, the helicopter must carry at least 10 packages, and the total weight of the packages can be at most 1,100 pounds. What is the maximum number of 120-pound packages that the helicopter can carry per trip?","c":["2","4","5","6"],"a":"C","e":"Пусть y пакетов по 120, остальные 10 − y по 100.\n1000 + 20y ≤ 1100 → y ≤ 5."},{"id":141,"s":"linear_inequalities","t":"writing inequality from context (walk vs bus)","d":"h","q":"Adam's school is a 20-minute walk or a 5-minute bus ride away from his house. The bus runs once every 30 minutes, and the number of minutes, w, that Adam waits for the bus varies between 0 and 30. Which of the following inequalities gives the values of w for which it would be faster for Adam to walk to school?","c":["w − 5 < 20","w − 5 > 20","w + 5 < 20","w + 5 > 20"],"a":"D","e":"Автобус: ждём w + 5 мин. Пешком быстрее, если w + 5 > 20."},{"id":143,"s":"linear_inequalities","t":"compound inequality from context, parking spaces","d":"m","q":"In North America, the standard width of a parking space is at least 7.5 feet and no more than 9.0 feet. A restaurant owner recently resurfaced the restaurant's parking lot and wants to determine the number of parking spaces, n, in the parking lot that could be placed perpendicular to a curb that is 135 feet long, based on the standard width of a parking space. Which of the following describes all the possible values of n?","c":["18 ≤ n ≤ 135","7.5 ≤ n ≤ 9","15 ≤ n ≤ 135","15 ≤ n ≤ 18"],"a":"D","e":"135/9 = 15 и 135/7.5 = 18 → 15 ≤ n ≤ 18."},{"id":145,"s":"linear_inequalities","t":"solution to system of inequalities","d":"m","q":"y ≤ x\ny ≤ −x\nWhich of the following ordered pairs (x, y) is a solution to the system of inequalities above?","c":["(1, 0)","(−1, 0)","(0, 1)","(0, −1)"],"a":"D","e":"(0, −1): −1 ≤ 0 и −1 ≤ 0 — оба верны.\nDesmos: вбей оба неравенства и посмотри, какая точка в двойной штриховке."},{"id":146,"s":"linear_inequalities","t":"inequality in context, minimum number of trips","d":"h","q":"A local transit company sells a monthly pass for $95 that allows an unlimited number of trips of any length. Tickets for individual trips cost $1.50, $2.50, or $3.50, depending on the length of the trip. What is the minimum number of trips per month for which a monthly pass could cost less than purchasing individual tickets for trips?","c":[],"a":"28","e":"Самые дорогие билеты $3.50: 3.5n > 95 → n > 27.1.\nМинимум 28 поездок."},{"id":147,"s":"linear_inequalities","t":"solution point to system of inequalities","d":"h","q":"y ≤ x + 7\ny ≥ −2x − 1\nWhich point (x, y) is a solution to the given system of inequalities in the xy-plane?","c":["(−14, 0)","(0, −14)","(0, 14)","(14, 0)"],"a":"D","e":"(14, 0): 0 ≤ 21 и 0 ≥ −29 — верно.\nDesmos: точка в общей области."},{"id":148,"s":"linear_inequalities","t":"writing inequality in two variables from context (truck weight)","d":"m","q":"A truck can haul a maximum weight of 5,630 pounds. During one trip, the truck will be used to haul a 190-pound piece of equipment as well as several crates. Some of these crates weigh 25 pounds each and the others weigh 62 pounds each. Which inequality represents the possible combinations of the number of 25-pound crates, x, and the number of 62-pound crates, y, the truck can haul during one trip if only the piece of equipment and the crates are being hauled?","c":["25x + 62y ≤ 5,440","25x + 62y ≥ 5,440","62x + 25y ≤ 5,630","62x + 25y ≥ 5,630"],"a":"A","e":"На ящики остаётся 5630 − 190 = 5440.\n25x + 62y ≤ 5440."},{"id":149,"s":"linear_inequalities","t":"region of xy-plane containing solutions","d":"m","q":"In the xy-plane, which of the following does NOT contain any points that are part of the solution set to 5x − 7y > 35?","c":["The x-axis","The region where x > 0 and y > 0","The region where x < 0 and y < 0","The region where x < 0 and y > 0"],"a":"D","e":"При x < 0, y > 0: 5x < 0 и −7y < 0 → 5x − 7y < 0 < 35.\nТам решений нет."},{"id":150,"s":"linear_inequalities","t":"compound inequality from context, salary and commission","d":"h","q":"A salesperson's total earnings consist of a base salary of x dollars per year, plus commission earnings of 11% of the total sales the salesperson makes during the year. This year, the salesperson has a goal for the total earnings to be at least 3 times and at most 4 times the base salary. Which of the following inequalities represents all possible values of total sales s, in dollars, the salesperson can make this year in order to meet that goal?","c":["2x ≤ s ≤ 3x","(2/0.11)x ≤ s ≤ (3/0.11)x","3x ≤ s ≤ 4x","(3/0.11)x ≤ s ≤ (4/0.11)x"],"a":"B","e":"x + 0.11s от 3x до 4x → 0.11s от 2x до 3x.\n(2/0.11)x ≤ s ≤ (3/0.11)x."},{"id":151,"s":"linear_inequalities","t":"comparing costs, inequality in one variable","d":"m","q":"To complete a landscaping project, Adam charges a fee of $20.00 for his equipment and $9.50 per hour spent working on the project. To complete this same landscaping project, Caroline charges a fee of $17.00 for her equipment and $10.00 per hour spent working on the project. If x represents the number of hours spent working on the landscaping project, what are all the values of x for which Caroline's total charge is greater than Adam's total charge?","c":["5 ≤ x ≤ 6","6 ≤ x ≤ 7","x < 5","x > 6"],"a":"D","e":"17 + 10x > 20 + 9.5x → 0.5x > 3 → x > 6."},{"id":152,"s":"linear_inequalities","t":"translate words to inequality, greatest value","d":"h","q":"A number x is at most 2 less than 3 times the value of y. If the value of y is −4, what is the greatest possible value of x?","c":[],"a":"-14","e":"x ≤ 3 · (−4) − 2 = −14 → наибольший x = −14."},{"id":153,"s":"linear_inequalities","t":"solution point to two-variable inequality","d":"m","q":"y < −4x + 4\nWhich point (x, y) is a solution to the given inequality in the xy-plane?","c":["(−4, 0)","(0, 5)","(2, 1)","(2, −1)"],"a":"A","e":"(−4, 0): 0 < 16 + 4 = 20 — верно."},{"id":154,"s":"linear_inequalities","t":"compound inequality from context, elephant weight","d":"m","q":"A certain elephant weighs 200 pounds at birth and gains more than 2 but less than 3 pounds per day during its first year. Which of the following inequalities represents all possible weights w, in pounds, for the elephant 365 days after birth?","c":["400 < w < 600","565 < w < 930","730 < w < 1,095","930 < w < 1,295"],"a":"D","e":"200 + 2 · 365 = 930, 200 + 3 · 365 = 1295."},{"id":155,"s":"linear_inequalities","t":"budget inequality, greatest whole number","d":"m","q":"An event planner is planning a party. It costs the event planner a onetime fee of $35 to rent the venue and $10.25 per attendee. The event planner has a budget of $300. What is the greatest number of attendees possible without exceeding the budget?","c":[],"a":"25","e":"35 + 10.25n ≤ 300 → n ≤ 25.85 → 25."},{"id":156,"s":"linear_inequalities","t":"compound inequality from formula, heart rate","d":"m","q":"H = 120p + 60\nThe Karvonen formula above shows the relationship between Alice's target heart rate H, in beats per minute (bpm), and the intensity level p of different activities. When p = 0, Alice has a resting heart rate. When p = 1, Alice has her maximum heart rate. It is recommended that p be between 0.5 and 0.85 for Alice when she trains. Which of the following inequalities describes Alice's target training heart rate?","c":["120 ≤ H ≤ 162","102 ≤ H ≤ 120","60 ≤ H ≤ 162","60 ≤ H ≤ 102"],"a":"A","e":"p = 0.5: H = 120. p = 0.85: H = 162."},{"id":157,"s":"linear_inequalities","t":"system of inequalities, maximize large candles","d":"h","q":"A small business owner budgets $2,200 to purchase candles. The owner must purchase a minimum of 200 candles to maintain the discounted pricing. If the owner pays $4.90 per candle to purchase small candles and $11.60 per candle to purchase large candles, what is the maximum number of large candles the owner can purchase to stay within the budget and maintain the discounted pricing?","c":[],"a":"182","e":"Мелких 200 − L: 4.90(200 − L) + 11.60L ≤ 2200.\n980 + 6.7L ≤ 2200 → L ≤ 182.09 → 182."},{"id":158,"s":"linear_inequalities","t":"translate words to inequality, greatest value","d":"m","q":"A number x is at most 17 less than 5 times the value of y. If the value of y is 3, what is the greatest possible value of x?","c":[],"a":"-2","e":"x ≤ 5 · 3 − 17 = −2."},{"id":163,"s":"lines_angles_triangles","t":"triangle angle sum, third angle","d":"m","q":"The sum of the measures of two angles in a triangle is 64°. What is the measure of the third angle?","c":["26°","52°","116°","128°"],"a":"C","e":"180° − 64° = 116°."},{"id":168,"s":"lines_angles_triangles","t":"similar triangles, angle-angle criterion","d":"h","q":"In triangle ABC, the measure of angle A is 52° and AC = 30. In triangle PQR, the measure of angle P is 52° and PR = 120. Which additional piece of information is sufficient to prove that triangle ABC is similar to triangle PQR?","c":["AB = 50 and PQ = 50.","AB = 50 and QR = 200.","The measures of angle B and angle R are 32° and 96°, respectively.","The measures of angle B and angle Q are 52° and 32°, respectively."],"a":"C","e":"В ABC: C = 180 − 52 − 32 = 96°. В PQR: P = 52°, R = 96°.\nДва угла равны → подобны (AA)."},{"id":169,"s":"lines_angles_triangles","t":"altitude of right triangle, similar triangles ratio","d":"h","q":"In triangle ABC, the measure of angle B is 90° and BD is an altitude of the triangle. The length of AB is 15 and the length of AC is 23 greater than the length of AB. What is the value of BC/BD?","c":["15/38","15/23","23/15","38/15"],"a":"D","e":"AC = 15 + 23 = 38. Треугольники ABC и BDC подобны.\nBC/BD = AC/AB = 38/15."},{"id":170,"s":"lines_angles_triangles","t":"similar triangles, shadows","d":"m","q":"Two nearby trees are perpendicular to the ground, which is flat. One of these trees is 10 feet tall and has a shadow that is 5 feet long. At the same time, the shadow of the other tree is 2 feet long. How tall, in feet, is the other tree?","c":["3","4","8","27"],"a":"B","e":"Отношение высоты к тени: 10/5 = 2.\n2 · 2 = 4."},{"id":172,"s":"lines_angles_triangles","t":"similar triangles, corresponding sides","d":"m","q":"Triangle ABC is similar to triangle XYZ, where A, B, and C correspond to X, Y, and Z, respectively. In triangle ABC, the length of AB is 170 and the length of BC is 850. In triangle XYZ, the length of YZ is 60. What is the length of XY?","c":["204","182","60","12"],"a":"D","e":"AB/BC = 170/850 = 1/5.\nXY = YZ/5 = 60/5 = 12."},{"id":175,"s":"lines_angles_triangles","t":"similar vs congruent triangles, sufficient information","d":"h","q":"In triangles ABC and DEF, angles B and E each have measure 27° and angles C and F each have measure 41°. Which additional piece of information is sufficient to determine whether triangle ABC is congruent to triangle DEF?","c":["The measure of angle A","The length of side AB","The lengths of sides BC and EF","No additional information is necessary."],"a":"C","e":"Два угла уже равны. Нужна одна пара соответствующих сторон: BC и EF (ASA)."},{"id":176,"s":"lines_angles_triangles","t":"similar triangles, angle-angle criterion","d":"h","q":"In triangles LMN and RST, angles L and R each have measure 60°, LN = 10, and RT = 30. Which additional piece of information is sufficient to prove that triangle LMN is similar to triangle RST?","c":["MN = 7 and ST = 7","MN = 7 and ST = 21","The measures of angles M and S are 70° and 60°, respectively.","The measures of angles M and T are 70° and 50°, respectively."],"a":"D","e":"LMN: N = 180 − 60 − 70 = 50°. RST: T = 50°.\nДва угла равны → подобны (AA)."},{"id":177,"s":"lines_angles_triangles","t":"scale factor, similar triangles","d":"m","q":"Each side of equilateral triangle S is multiplied by a scale factor of k to create equilateral triangle T. The length of each side of triangle T is greater than the length of each side of triangle S. Which of the following could be the value of k?","c":["29/28","1","28/29","0"],"a":"A","e":"T больше S → k > 1. Подходит 29/28."},{"id":179,"s":"nonlinear_equations","t":"rewriting equation to solve for a variable","d":"m","q":"v = −w/(150x)\nThe given equation relates the distinct positive numbers v, w, and x. Which equation correctly expresses w in terms of v and x?","c":["w = −150vx","w = −150v/x","w = −x/(150v)","w = v + 150x"],"a":"A","e":"Умножаем на 150x: 150vx = −w → w = −150vx."},{"id":181,"s":"nonlinear_equations","t":"system of linear and quadratic equations","d":"m","q":"y = x + 1\ny = x² + x\nIf (x, y) is a solution to the system of equations above, which of the following could be the value of x?","c":["−1","0","2","3"],"a":"A","e":"x + 1 = x² + x → x² = 1 → x = ±1.\nИз вариантов: −1.\nDesmos: две кривые, смотри x точек пересечения."},{"id":182,"s":"nonlinear_equations","t":"quadratic formula, irrational roots","d":"m","q":"x² − x − 1 = 0\nWhat values satisfy the equation above?","c":["x = 1 and x = 2","x = −1/2 and x = 3/2","x = (1+√5)/2 and x = (1−√5)/2","x = (−1+√5)/2 and x = (−1−√5)/2"],"a":"C","e":"Дискриминант: 1 + 4 = 5.\nx = (1 ± √5)/2."},{"id":183,"s":"nonlinear_equations","t":"absolute value equation","d":"h","q":"2|4 − x| + 3|4 − x| = 25\nWhat is the positive solution to the given equation?","c":[],"a":"9","e":"5|4 − x| = 25 → |4 − x| = 5.\nx = −1 или x = 9 → положительный 9."},{"id":184,"s":"nonlinear_equations","t":"completing the square, form of solution","d":"h","q":"x² − 2x − 9 = 0\nOne solution to the given equation can be written as 1 + √k, where k is a constant. What is the value of k?","c":["8","10","20","40"],"a":"B","e":"x² − 2x + 1 = 10 → (x − 1)² = 10.\nx = 1 ± √10 → k = 10."},{"id":185,"s":"nonlinear_equations","t":"line tangent to parabola, discriminant","d":"h","q":"In the xy-plane, a line with equation 2y = 4.5 intersects a parabola at exactly one point. If the parabola has equation y = −4x² + bx, where b is a positive constant, what is the value of b?","c":[],"a":"6","e":"Прямая y = 2.25. Одна общая точка → дискриминант = 0.\n4x² − bx + 2.25 = 0: b² = 16 · 2.25 = 36 → b = 6."},{"id":186,"s":"nonlinear_equations","t":"system of linear and quadratic equations, ordered pair","d":"h","q":"x − y = 1\nx + y = x² − 3\nWhich ordered pair is a solution to the system of equations above?","c":["(1 + √3, √3)","(√3, −√3)","(1 + √5, √5)","(√5, −1 + √5)"],"a":"A","e":"x = y + 1: (y + 1) + y = (y + 1)² − 3.\ny² = 3 → y = √3, x = 1 + √3.\nИли подставь варианты в оба уравнения."},{"id":187,"s":"nonlinear_equations","t":"discriminant, number of solutions","d":"m","q":"x² − 12x + 27 = 0\nHow many distinct real solutions does the given equation have?","c":["Exactly two","Exactly one","Zero","Infinitely many"],"a":"A","e":"(x − 3)(x − 9) = 0 → два решения."},{"id":188,"s":"nonlinear_equations","t":"discriminant, no real solutions, largest integer","d":"h","q":"r² + qr = 2r − 55\nIn the given equation, q is an integer constant. The given equation has no real solutions. What is the largest possible value of q?","c":[],"a":"16","e":"r² + (q − 2)r + 55 = 0. Нет корней → D < 0.\n(q − 2)² < 220 → q − 2 ≤ 14 → q = 16."},{"id":189,"s":"nonlinear_equations","t":"rational equation with perfect square denominator","d":"h","q":"1/(x² + 10x + 25) = 4\nIf x is a solution to the given equation, which of the following is a possible value of x + 5?","c":["1/2","5/2","9/2","11/2"],"a":"A","e":"x² + 10x + 25 = (x + 5)² = 1/4.\nx + 5 = ±1/2 → подходит 1/2."},{"id":190,"s":"nonlinear_equations","t":"radical equation with exactly one solution, discriminant","d":"h","q":"√(k − x) = 58 − x\nIn the given equation, k is a constant. The equation has exactly one real solution. What is the minimum possible value of 4k?","c":[],"a":"231","e":"Пусть u = 58 − x ≥ 0, тогда k = u² − u + 58.\nОдно решение и минимум k — в вершине: u = 1/2, k = 57.75.\n4k = 231."},{"id":191,"s":"nonlinear_equations","t":"rewriting formula in a given form","d":"h","q":"During a 5-second time interval, the average acceleration a, in meters per second squared, of an object with an initial velocity of 12 meters per second is defined by the equation a = (v_f − 12)/5, where v_f is the final velocity of the object in meters per second. If the equation is rewritten in the form v_f = xa + y, where x and y are constants, what is the value of x?","c":[],"a":"5","e":"5a = v_f − 12 → v_f = 5a + 12 → x = 5."},{"id":192,"s":"nonlinear_equations","t":"quadratic formula, form of solution","d":"h","q":"2x² − 8x − 7 = 0\nOne solution to the given equation can be written as (8 − √k)/4, where k is a constant. What is the value of k?","c":[],"a":"120","e":"x = (8 ± √(64 + 56))/4 = (8 ± √120)/4.\nk = 120."},{"id":193,"s":"nonlinear_equations","t":"rewriting equation to solve for a variable","d":"m","q":"7m = 5(n + p)\nThe given equation relates the positive numbers m, n, and p. Which equation correctly gives n in terms of m and p?","c":["n = 5p/(7m)","n = 7m/5 − p","n = 5(7m) + p","n = 7m − 5 − p"],"a":"B","e":"n + p = 7m/5 → n = 7m/5 − p."},{"id":194,"s":"nonlinear_equations","t":"quadratic formula","d":"h","q":"2x² − 2 = 2x + 3\nWhich of the following is a solution to the equation above?","c":["2","1 − √11","1/2 + √11","(1 + √11)/2"],"a":"D","e":"2x² − 2x − 5 = 0.\nx = (2 ± √44)/4 = (1 ± √11)/2."},{"id":195,"s":"nonlinear_equations","t":"number of real solutions, no real solutions","d":"m","q":"x² = −841\nHow many distinct real solutions does the given equation have?","c":["Exactly one","Exactly two","Infinitely many","Zero"],"a":"D","e":"Квадрат не бывает отрицательным → решений нет."},{"id":196,"s":"nonlinear_equations","t":"line tangent to parabola, discriminant","d":"h","q":"In the xy-plane, a line with equation 2y = c for some constant c intersects a parabola at exactly one point. If the parabola has equation y = −2x² + 9x, what is the value of c?","c":[],"a":"81/4","e":"Прямая y = c/2 касается параболы в вершине.\nx = 9/4, y = −2 · 81/16 + 81/4 = 81/8.\nc/2 = 81/8 → c = 81/4."},{"id":197,"s":"nonlinear_equations","t":"factored form, zero product property","d":"m","q":"(d − 30)(d + 30) − 7 = −7\nWhat is a solution to the given equation?","c":[],"a":"30, -30","e":"−7 сокращаются: d² − 900 = 0 → d = ±30."},{"id":198,"s":"nonlinear_equations","t":"square root of both sides, sum of solutions","d":"h","q":"(x − 47)² = 1\nWhat is the sum of the solutions to the given equation?","c":[],"a":"94","e":"x − 47 = ±1 → 48 и 46.\nСумма 94."},{"id":199,"s":"nonlinear_functions","t":"interpreting terms of a quadratic area function","d":"m","q":"A rectangle has a length that is 15 times its width. The function y = (15w)(w) represents this situation, where y is the area, in square feet, of the rectangle and y > 0. Which of the following is the best interpretation of 15w in this context?","c":["The length of the rectangle, in feet","The area of the rectangle, in square feet","The difference between the length and the width of the rectangle, in feet","The width of the rectangle, in feet"],"a":"A","e":"Длина в 15 раз больше ширины → 15w — длина."},{"id":200,"s":"nonlinear_functions","t":"exponential growth, percent increase per interval","d":"h","q":"f(x) = 27(1.20)^(x/3)\nFor the given function f, the value of f(x) increases by p% for every increase of x by 6. What is the value of p?","c":[],"a":"44","e":"+6 по x = два шага по 3: 1.20² = 1.44.\nРост на 44%."},{"id":201,"s":"nonlinear_functions","t":"exponential function, number of x-intercepts","d":"h","q":"y = 9(a/7)ˣ⁺ᶜ − b\nHow many times does the graph of the given equation in the xy-plane cross the x-axis, where a, b, and c are positive constants such that a > 7 and b > c?","c":["Zero","One","Two","Three"],"a":"B","e":"a/7 > 1 → растущая экспонента, асимптота y = −b < 0.\nПересекает ось x один раз."},{"id":202,"s":"nonlinear_equations","t":"quadratic word problem, product of two integers","d":"h","q":"The product of two positive integers is 462. If the first integer is 5 greater than twice the second integer, what is the smaller of the two integers?","c":[],"a":"14","e":"Меньшее x, большее 2x + 5: x(2x + 5) = 462.\nx = 14 (14 · 33 = 462)."},{"id":203,"s":"nonlinear_functions","t":"evaluating function with absolute value and negative constant","d":"h","q":"The function g is defined by g(x) = |x|/a − 14, where a < 0. What is the product of g(15a) and g(7a)?","c":[],"a":"609","e":"a < 0 → |15a| = −15a, g(15a) = −15 − 14 = −29.\ng(7a) = −7 − 14 = −21.\n(−29)(−21) = 609."},{"id":204,"s":"nonlinear_functions","t":"exponential decay, initial value","d":"m","q":"y = 7,400(0.87)ˣ\nThe given equation estimates the value, in dollars, of a certain piece of equipment x years after it was purchased. According to the given equation, what was the estimated value, in dollars, of the piece of equipment at the time it was purchased?","c":["740","6,438","7,400","8,700"],"a":"C","e":"При покупке x = 0: 7400 · 1 = 7400."},{"id":206,"s":"nonlinear_functions","t":"x-intercepts of a quadratic in vertex form","d":"h","q":"h(x) = 2(x − 4)² − 32\nThe quadratic function h is defined as shown. In the xy-plane, the graph of y = h(x) intersects the x-axis at the points (0, 0) and (t, 0), where t is a constant. What is the value of t?","c":["1","2","4","8"],"a":"D","e":"2(x − 4)² = 32 → (x − 4)² = 16.\nx = 0 или 8 → t = 8."},{"id":207,"s":"nonlinear_functions","t":"minimum value of a quadratic, completing the square","d":"h","q":"f(x) = x² − 48x + 2,304\nWhat is the minimum value of the given function?","c":[],"a":"1728","e":"Вершина x = 48/2 = 24.\nf(24) = 576 − 1152 + 2304 = 1728."},{"id":208,"s":"nonlinear_functions","t":"y-intercept of an exponential function","d":"h","q":"The function f is defined by f(x) = (−8)(2)ˣ + 22. What is the y-intercept of the graph of y = f(x) in the xy-plane?","c":["(0, 14)","(0, 2)","(0, 22)","(0, −8)"],"a":"A","e":"f(0) = −8 · 1 + 22 = 14."},{"id":209,"s":"nonlinear_functions","t":"vertex of a quadratic revenue model, maximum","d":"h","q":"An auditorium has seats for 1,800 people. Tickets to attend a show at the auditorium currently cost $4.00. For each $1.00 increase to the ticket price, 100 fewer tickets will be sold. This situation can be modeled by the equation y = −100x² + 1,400x + 7,200, where x represents the increase in ticket price, in dollars, and y represents the revenue, in dollars, from ticket sales. If this equation is graphed in the xy-plane, at what value of x is the maximum of the graph?","c":["4","7","14","18"],"a":"B","e":"Вершина: x = −1400/(2 · (−100)) = 7."},{"id":210,"s":"nonlinear_functions","t":"minimum value of quadratic function","d":"m","q":"p(x) + 57 = x²\nThe given equation relates the value of x and its corresponding value of p(x) for the function p. What is the minimum value of the function p?","c":["−3,249","−57","57","3,249"],"a":"B","e":"p(x) = x² − 57, минимум при x = 0: −57."},{"id":211,"s":"nonlinear_functions","t":"interpreting y-intercept of exponential decay model","d":"h","q":"f(x) = 9,000(0.66)ˣ\nThe given function f models the number of advertisements a company sent to its clients each year, where x represents the number of years since 1997, and 0 ≤ x ≤ 5. If y = f(x) is graphed in the xy-plane, which of the following is the best interpretation of the y-intercept of the graph in this context?","c":["The minimum estimated number of advertisements the company sent to its clients during the 5 years was 1,708.","The minimum estimated number of advertisements the company sent to its clients during the 5 years was 9,000.","The estimated number of advertisements the company sent to its clients in 1997 was 1,708.","The estimated number of advertisements the company sent to its clients in 1997 was 9,000."],"a":"D","e":"y-intercept: x = 0 (1997), f(0) = 9000."},{"id":212,"s":"nonlinear_functions","t":"geometric sequence nth term","d":"h","q":"The first term of a sequence is 9. Each term after the first is 4 times the preceding term. If w represents the nth term of the sequence, which equation gives w in terms of n?","c":["w = 4(9ⁿ)","w = 4(9ⁿ⁻¹)","w = 9(4ⁿ)","w = 9(4ⁿ⁻¹)"],"a":"D","e":"Геометрическая: w = 9 · 4ⁿ⁻¹ (первый член при n = 1 — это 9)."},{"id":213,"s":"nonlinear_functions","t":"equivalent exponential forms, y-intercept as constant or coefficient","d":"h","q":"The function f is defined by f(x) = a(2.2ˣ + 2.2ᵇ), where a and b are integer constants and 0 < a < b. The functions g and h are equivalent
