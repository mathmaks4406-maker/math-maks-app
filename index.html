<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Math Maks · SAT Math</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f2f4f8;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5e9f0;--acc:#1d4ed8;--acc2:#dbe4ff;--ok:#15803d;--okbg:#e7f6ec;--bad:#b91c1c;--badbg:#fdecec;--warn:#b45309;--warnbg:#fff4df;--desm:#0e7490;--desmbg:#e6f6fa;
  --r:16px;--tab:64px;
}
:root[data-theme="dark"]{--bg:#0f1419;--card:#1a212b;--ink:#eef2f7;--mut:#94a3b8;--line:#2a3340;--acc:#6b9cff;--acc2:#213252;--ok:#4ade80;--okbg:#13311f;--bad:#f87171;--badbg:#3a1a1a;--warn:#fbbf24;--warnbg:#3a2c10;--desm:#67e8f9;--desmbg:#0f2f38}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Roboto,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--acc);text-decoration:none}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 24px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.brand i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--acc);color:#fff;font-style:normal;font-weight:900;font-size:17px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card h2{font-size:16px;margin-bottom:10px}
.muted{color:var(--mut);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:11px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45}
.btn.ok{background:var(--ok)}
.btn.icon{min-width:48px;padding:0}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--mut);white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
select{width:100%;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex;z-index:20}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut)}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--acc)}
/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.ring{position:relative;width:92px;height:92px}
.ring svg{transform:rotate(-90deg);width:92px;height:92px}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--acc);transition:stroke-dashoffset .6s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px}
.ring b small{display:block;font-size:11px;color:var(--mut);font-weight:500;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--mut)}
.flame{font-size:22px}
.topics{display:flex;flex-direction:column;gap:9px}
.topic{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:4px 0}
.topic .nm{font-size:14px;font-weight:600}
.topic .pc{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.bar{grid-column:1/3;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.bar i.lo{background:var(--bad)}.bar i.mid{background:var(--warn)}.bar i.hi{background:var(--ok)}
.dom-h{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.dom-h:first-child{margin-top:0}
/* task */
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--mut);margin-bottom:10px}
.meta .diff{padding:2px 8px;border-radius:999px;font-weight:700;font-size:11px}
.diff.e{background:var(--okbg);color:var(--ok)}.diff.m{background:var(--warnbg);color:var(--warn)}.diff.h{background:var(--badbg);color:var(--bad)}
.q{font-size:17px;line-height:1.5}
.q p{margin:0 0 8px}
.q p.eq{text-align:center;font-size:19px;margin:10px 0}
.q table{border-collapse:collapse;margin:8px auto;font-size:15px}
.q td,.q th{border:1px solid var(--line);padding:5px 12px;text-align:center}
.fig{margin:10px 0 4px;text-align:center}
.fig img{display:inline-block;max-width:100%;max-height:min(380px,52vh);border-radius:10px;background:#fff;padding:6px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.15;font-size:.92em}
.fr>span{padding:0 3px}
.fr>span:first-child{border-bottom:1.5px solid currentColor}
sup{font-size:.7em;line-height:0}
.opts{display:grid;gap:8px;margin-top:14px}
.opts.row{grid-template-columns:repeat(4,1fr)}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:left;font-size:16px;transition:border-color .12s}
.opt .l{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--bg);font-weight:800;font-size:14px;color:var(--mut)}
.opts.row .opt{justify-content:center;padding:12px 0}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.gi{display:flex;gap:8px;margin-top:14px}
.gi input{flex:1;min-width:0;min-height:50px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:18px}
.gi input:focus{outline:none;border-color:var(--acc)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.keys button{min-height:44px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:19px;font-weight:600}
.pv{min-height:26px;margin-top:8px;font-size:18px;text-align:center;color:var(--mut)}
.res{margin-top:14px;border-radius:14px;padding:14px;border:1.5px solid}
.res.ok{border-color:var(--ok);background:var(--okbg)}.res.bad{border-color:var(--bad);background:var(--badbg)}
.res h3{font-size:16px;margin-bottom:8px}
.res.ok h3{color:var(--ok)}.res.bad h3{color:var(--bad)}
.ex{background:var(--card);border-radius:12px;padding:12px;margin-top:8px}
.ex p{margin:0 0 8px;font-size:15px;line-height:1.5}
.ex p:last-child{margin-bottom:0}
.ex .idea{font-weight:700;font-size:16px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.ex .step{padding-left:26px;position:relative}
.ex .step::before{content:attr(data-n);position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;background:var(--acc2);color:var(--acc);font-size:11px;font-weight:800;display:grid;place-items:center}
.ex .ans{font-weight:700;margin-top:4px}
.ex .trap,.ex .desm{padding:8px 10px;border-radius:10px;font-size:14px;margin-top:8px}
.ex .trap{background:var(--warnbg);color:var(--warn)}
.ex .desm{background:var(--desmbg);color:var(--desm)}
.ex .trap b,.ex .desm b{font-weight:800}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.nav .sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut)}
.ib.on{color:var(--warn);border-color:var(--warn)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.on svg{fill:currentColor}
.actions{display:flex;gap:8px;margin-top:14px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-top:10px}
.cell{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--mut)}
.cell.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.cell.bad{background:var(--badbg);color:var(--bad);border-color:transparent}.cell.cur{border-color:var(--acc);color:var(--acc)}
.empty{padding:28px 10px;text-align:center;color:var(--mut)}
/* test */
.tbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-variant-numeric:tabular-nums}
.tbar .tm{font-weight:800;font-size:18px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 12px}
.dot{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--mut);display:grid;place-items:center}
.dot.a{background:var(--acc2);color:var(--acc);border-color:transparent}.dot.f{border-color:var(--warn);color:var(--warn)}.dot.cur{outline:2px solid var(--acc)}
.dot.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.dot.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.score{font-size:40px;font-weight:800;text-align:center;margin:6px 0}
.score small{display:block;font-size:14px;color:var(--mut);font-weight:500}
/* board */
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;min-height:36px;border-radius:10px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.lb li:last-child{border-bottom:0}
.lb .pl{width:28px;text-align:center;font-weight:800;color:var(--mut)}
.lb li:nth-child(1) .pl{color:#d4a017}.lb li:nth-child(2) .pl{color:#9aa4b2}.lb li:nth-child(3) .pl{color:#b87333}
.lb .nm{flex:1;font-weight:600}
.lb .st{font-size:12px;color:var(--mut)}
.lb li.me{background:var(--acc2);border-radius:10px;padding-left:8px;padding-right:8px}
.adm-t{width:100%;border-collapse:collapse;font-size:14px}
.adm-t th,.adm-t td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
.adm-t tr.hid td{opacity:.45}
.lnk{color:var(--acc);font-weight:600}
.name-screen{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.name-screen input{width:100%;min-height:52px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:18px;margin:12px 0}
.help p{margin:0 0 8px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.skel{padding:40px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i>M</i><div>Math Maks<small>SAT Math тренажёр</small></div></div>
    <button class="pill" id="who" type="button" hidden></button>
  </header>

  <section id="nameScreen" class="name-screen" hidden>
    <h1 style="font-size:24px">Как тебя зовут?</h1>
    <p class="muted" style="margin:6px 0 0">Под этим именем сохранится прогресс и место в рейтинге.</p>
    <form id="nf"><input id="ni" maxlength="30" autocomplete="off" placeholder="Имя"><button class="btn wide" type="submit">Начать</button></form>
    <p class="muted" style="margin-top:14px">Задача дня и приёмы SAT Math: <a href="https://t.me/Math_Maks" target="_blank" rel="noopener">@Math_Maks</a></p>
  </section>

  <main id="app" hidden>
    <section id="v-home"></section>
    <section id="v-practice" hidden></section>
    <section id="v-test" hidden></section>
    <section id="v-board" hidden></section>
  </main>
  <div class="skel" id="loading">Загружаю задачи…</div>
</div>

<nav class="tabs" id="tabs" hidden>
  <button data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Главная</button>
  <button data-v="practice"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg>Задачи</button>
  <button data-v="test"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>Тест</button>
  <button data-v="board"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M5 4h14v4a7 7 0 0 1-14 0zM5 6H2v2a3 3 0 0 0 3 3M19 6h3v2a3 3 0 0 1-3 3"/></svg>Рейтинг</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ---------- data ---------- */
let TASKS = null;
const DATA_URL = "data.json?v=1925";
const API = "https://math-maks-api.math-maks4406.workers.dev";
const DOMAINS = [
  {k:"alg", n:"Algebra", s:["linear_eq_1var","linear_eq_2var","linear_functions","systems_linear","linear_inequalities"]},
  {k:"adv", n:"Advanced Math", s:["equivalent_expressions","nonlinear_equations","nonlinear_functions"]},
  {k:"psda", n:"Problem-Solving & Data", s:["ratios_rates_units","percentages","one_var_data","two_var_data","probability","inference","study_design"]},
  {k:"geo", n:"Geometry & Trig", s:["area_volume","lines_angles_triangles","right_triangles_trig","circles"]}
];
const SKILL = {
  linear_eq_1var:"Linear equations in 1 variable", linear_eq_2var:"Linear equations in 2 variables",
  linear_functions:"Linear functions", systems_linear:"Systems of linear equations", linear_inequalities:"Linear inequalities",
  equivalent_expressions:"Equivalent expressions", nonlinear_equations:"Nonlinear equations", nonlinear_functions:"Nonlinear functions",
  ratios_rates_units:"Ratios, rates, units", percentages:"Percentages", one_var_data:"One-variable data",
  two_var_data:"Two-variable data", probability:"Probability", inference:"Inference & margin of error",
  study_design:"Study design", area_volume:"Area and volume", lines_angles_triangles:"Lines, angles, triangles",
  right_triangles_trig:"Right triangles & trig", circles:"Circles"
};
const DIFF = {e:"Easy", m:"Medium", h:"Hard"};
const domOf = s => DOMAINS.find(d => d.s.includes(s));
const byId = {};

/* ---------- Telegram ---------- */
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const CLOUD = TG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast("6.9") ? TG.CloudStorage : null;
function applyTheme(){
  const dark = TG ? TG.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  if (TG) { try { TG.setHeaderColor(dark ? "#1a212b" : "#ffffff"); TG.setBackgroundColor(dark ? "#0f1419" : "#f2f4f8"); } catch(e) {} }
}
applyTheme();
if (TG) { try { TG.onEvent("themeChanged", applyTheme); } catch(e) {} }
else matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
const haptic = kind => { try { TG && TG.HapticFeedback && (kind === "ok" || kind === "bad" ? TG.HapticFeedback.notificationOccurred(kind === "ok" ? "success" : "error") : TG.HapticFeedback.impactOccurred("light")); } catch(e) {} };

/* ---------- storage ---------- */
const KEY = "mm_sat_trainer_v3";
let S = {name:"", done:{}, best:0, streak:0, days:[], goal:10, marks:[], last:0, f:{dom:"", skill:"", diff:"", mode:"all"}, ev:[]};
const packDone = d => Object.entries(d).map(([id,r]) => id + ":" + r.n + ":" + r.ok + ":" + r.last).join(";");
const unpackDone = str => { const d = {}; (str || "").split(";").forEach(x => { const p = x.split(":").map(Number); if (p.length === 4 && p[0]) d[p[0]] = {n:p[1], ok:p[2], last:p[3]}; }); return d; };
const cloudGet = keys => new Promise(res => { try { CLOUD.getItems(keys, (err, v) => res(err ? {} : (v || {}))); } catch(e) { res({}); } });
const cloudSet = (k, v) => { try { CLOUD.setItem(k, v, () => {}); } catch(e) {} };
const PK = ["p0","p1","p2","p3","p4","p5","p6","p7"];
async function load(){
  if (CLOUD) {
    const v = await cloudGet(["meta3","meta"].concat(PK));
    try { if (v.meta3) Object.assign(S, JSON.parse(v.meta3)); else if (v.meta) Object.assign(S, JSON.parse(v.meta)); } catch(e) {}
    S.done = unpackDone(PK.map(k => v[k]).filter(Boolean).join(";"));
  } else {
    try { const raw = localStorage.getItem(KEY) || localStorage.getItem("mm_sat_trainer_v1"); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
  }
  S.days = S.days || []; S.marks = S.marks || []; S.ev = S.ev || []; S.goal = S.goal || 10;
  if (!S.name && TG && TG.initDataUnsafe && TG.initDataUnsafe.user) S.suggest = TG.initDataUnsafe.user.first_name || "";
}
function save(){
  const meta = {name:S.name, best:S.best, streak:S.streak, days:S.days.slice(-70), goal:S.goal, marks:S.marks.slice(-300), last:S.last, f:S.f};
  if (CLOUD) {
    cloudSet("meta3", JSON.stringify(meta));
    const p = packDone(S.done), parts = [];
    for (let i = 0; i < p.length; ) { let j = Math.min(p.length, i + 3900); if (j < p.length) j = p.lastIndexOf(";", j) + 1 || j; parts.push(p.slice(i, j).replace(/;$/, "")); i = j; }
    PK.forEach((k, i) => cloudSet(k, parts[i] || ""));
  } else {
    try { localStorage.setItem(KEY, JSON.stringify(Object.assign({}, meta, {done:S.done}))); } catch(e) {}
  }
}

/* ---------- math formatting: a/b -> stacked fraction, ^(..) -> sup ---------- */
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TOK = /[0-9A-Za-zπ√∛.²³¹⁰-₟ᴬ-ᶿ_-]/;
function match(s, i, dir){ // i at bracket, returns index of partner
  let depth = 0;
  for (let j = i; j >= 0 && j < s.length; j += dir){
    if (s[j] === (dir>0?"(":")")) depth++;
    else if (s[j] === (dir>0?")":"(")) { depth--; if (!depth) return j; }
  }
  return -1;
}
function strip(x){ if (x[0]==="(" && match(x,0,1)===x.length-1) return x.slice(1,-1); return x; }
function frac(s){
  for (let i = 1; i < s.length-1; i++){
    if (s[i] !== "/" || s[i-1] === " " || s[i+1] === " ") continue;
    let a = i;               // left operand start
    let j = i-1;
    if (s[j] === ")") { const k = match(s,j,-1); if (k < 0) continue; j = k-1; }
    while (j >= 0 && TOK.test(s[j])) j--;
    a = j+1;
    let b = i+1; j = i+1;    // right operand end (exclusive)
    if (s[j] === "(") { const k = match(s,j,1); if (k < 0) continue; j = k+1; }
    else { while (j < s.length && TOK.test(s[j])) j++; if (s[j] === "(" && /[√∛]/.test(s[j-1])) { const k = match(s,j,1); if (k>0) j = k+1; }  while (j > i+1 && s[j-1] === "." && !/\d/.test(s[j] || "")) j--; }
    b = j;
    if (a === i || b === i+1) continue;
    const num = strip(s.slice(a,i)), den = strip(s.slice(i+1,b));
    return frac(s.slice(0,a)) + '<span class="fr"><span>' + frac(num) + '</span><span>' + frac(den) + '</span></span>' + frac(s.slice(b));
  }
  return s;
}
function fmt(raw){
  const sups = [];

  // pull out ^( ... ) groups as placeholders
  for (let i = s.indexOf("^("); i >= 0; i = s.indexOf("^(")){
    const k = match(s, i+1, 1); if (k < 0) break;
    sups.push(s.slice(i+2, k)); s = s.slice(0,i) + String.fromCharCode(0xE000 + sups.length-1) + s.slice(k+1);
  }
  s = frac(esc(s)).replace(/\((<span class="fr"><span>(?:(?!<span class="fr">|\)).)*?<\/span><\/span>)\)/g, "$1");
  return s.replace(/[-]/g, c => "<sup>" + esc(sups[c.charCodeAt(0)-0xE000]) + "</sup>");
}
function qhtml(q){

    const words = (line.match(/[A-Za-z]{3,}/g) || []).length;
    const isEq = words <= 1 && line.length < 60 && /[=<>≤≥]|\d/.test(line);
    return '<p' + (isEq ? ' class="eq"' : '') + '>' + fmt(line) + '</p>';
  }).join("");
}

/* ---------- answer checking for grid-in ---------- */
function val(x){
  x = String(x).trim().replace(/\s+/g,"").replace(/[−–]/g,"-").replace(/^\$/,"");
  if (/^-?\d*,\d+$/.test(x)) x = x.replace(",", ".");
  x = x.replace(/,/g, "");
  let m = x.match(/^(-?)(\d*\.?\d+)\/(\d*\.?\d+)$/);
  if (m) { const d = parseFloat(m[3]); return d ? (m[1]?-1:1) * parseFloat(m[2]) / d : NaN; }
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(x)) return parseFloat(x);
  return NaN;
}
function gridOk(input, answer){
  const u = val(input); if (isNaN(u)) return null;
  return answer.split(/,\s+/).some(a => { const v = val(a); return !isNaN(v) && Math.abs(u - v) < 1e-3 * Math.max(1, Math.abs(v) / 100); });
}
const shownAnswer = a => { const seen = []; return a.split(/,\s+/).filter(x => { const v = Math.round(val(x) * 100); if (seen.includes(v)) return false; seen.push(v); return true; }).map(x => x.replace(/^-/,"−").replace(/^\./,"0.")).join(" или "); };

const dayDiff = (a, b) => { const p = x => new Date(Math.floor(x / 10000), Math.floor(x / 100) % 100 - 1, x % 100); return Math.round((p(b) - p(a)) / 864e5); };
function streakNow(){
  const days = [...new Set(S.days)].sort((a, b) => b - a); if (!days.length) return 0;
  if (dayDiff(days[0], today()) > 1) return 0;

}

function qhtml2(q){
  // таблицы: подряд идущие строки с « | » → <table>
  const lines = q.split("\n"); let out = "", i = 0;
  while (i < lines.length) {

  }

}

    box.innerHTML = `<div class="card"><h2>Тест как на SAT</h2><p class="muted" style="margin:0 0 12px">Задачи вперемешку из всех тем, без подсказок. Разбор после финиша. Таймер: 1,5 минуты на задачу, как на экзамене.</p>

      <select id="tDom"><option value="">Все разделы</option>${DOMAINS.map(d => `<option value="${d.k}" ${S.tdom === d.k ? "selected" : ""}>${d.n}</option>`).join("")}</select>
      <button class="btn wide" style="margin-top:14px" id="tStart">Начать тест</button></div>` + (S.tests && S.tests.length ? `<div class="card"><h2>Прошлые тесты</h2>${S.tests.slice(-8).reverse().map(x => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="grow">${new Date(x.t).toLocaleDateString("ru")} · ${x.n} задач</span><b>${x.ok}/${x.n}</b><span class="muted">${fmtTime(x.sec)}</span></div>`).join("")}</div>` : "");
    $("tStart").onclick = startTest; return;
  }
  if (T.end) return renderTestResult();
  const t = T.qs[T.i], g = T.ans[t.id];
  box.innerHTML = `<div class="tbar"><span class="muted">Задача ${T.i + 1} из ${T.qs.length}</span><span class="tm" id="tm">${fmtTime(Math.max(0, T.limit - Math.floor((Date.now() - T.start) / 1000)))}</span></div>
    <div class="dots">${T.qs.map((q, i) => `<button class="dot ${i === T.i ? "cur" : ""} ${T.ans[q.id] !== undefined ? "a" : ""} ${T.flags.has(q.id) ? "f" : ""}" data-ti="${i}" type="button">${i + 1}</button>`).join("")}</div>
    <div class="card">${taskHtml(t, g !== undefined ? {pick: g} : null, {reveal: false, testBtn: "Ок"})}</div>
    <div class="actions"><button class="btn ghost" type="button" id="tPrev" ${T.i ? "" : "disabled"}>←</button><button class="btn ghost" type="button" id="tFlag">${T.flags.has(t.id) ? "🚩 Снять флаг" : "🚩 Флаг"}</button><button class="btn grow" type="button" id="tNext">${T.i < T.qs.length - 1 ? "Дальше →" : "Завершить"}</button></div>`;
  if (!t.c.length && g !== undefined) { const gi = $("gi"); if (gi) gi.value = g; }
}
const fmtTime = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
function startTest(){
  const n = S.tlen || 10, dom = $("tDom") ? $("tDom").value : "";
  let p = TASKS.filter(t => !dom || domOf(t.s).k === dom);
  const fresh = p.filter(t => !S.done[t.id]); if (fresh.length >= n) p = fresh;
  const qs = []; const pool2 = p.slice();
  while (qs.length < n && pool2.length) qs.push(pool2.splice(Math.floor(Math.random() * pool2.length), 1)[0]);
  T = {qs, i: 0, ans: {}, flags: new Set(), start: Date.now(), end: 0, limit: n * 90};
  T.timer = setInterval(() => { const el = $("tm"); if (!el) return; const left = T.limit - Math.floor((Date.now() - T.start) / 1000); el.textContent = fmtTime(Math.max(0, left)); if (left <= 0) finishTest(); }, 1000);
  renderTest();
}
function testAnswer(v){ const t = T.qs[T.i]; T.ans[t.id] = v; haptic(); if (T.i < T.qs.length - 1) { T.i++; renderTest(); } else renderTest(); }
function finishTest(){
  clearInterval(T.timer); T.end = Date.now();
  let ok = 0;
  for (const t of T.qs) {
    const a = T.ans[t.id]; let good = false;
    if (a !== undefined) good = t.c.length ? a === "ABCD".indexOf(t.a) : !!gridOk(a, t.a);
    T.res = T.res || {}; T.res[t.id] = good; if (good) ok++;
    if (a !== undefined) record(t, good, a, true);
  }
  S.tests = (S.tests || []).concat([{t: T.end, n: T.qs.length, ok, sec: Math.round((T.end - T.start) / 1000)}]).slice(-20); save();
  T.review = null; renderTest();
}
function renderTestResult(){
  const n = T.qs.length, ok = T.qs.filter(t => T.res[t.id]).length, sec = Math.round((T.end - T.start) / 1000);
  let h = `<div class="card"><div class="score">${ok}/${n}<small>${ok === n ? "Идеально! 🎉" : ok >= n * 0.7 ? "Хорошо. Разбери ошибки ниже." : "Разбери ошибки — так и растёт балл."} · время ${fmtTime(sec)}</small></div>
    <div class="dots" style="justify-content:center">${T.qs.map((q, i) => `<button class="dot ${T.res[q.id] ? "ok" : "bad"} ${T.review === i ? "cur" : ""}" data-rv="${i}" type="button">${i + 1}</button>`).join("")}</div>
    <div class="actions"><button class="btn ghost grow" type="button" id="tAgain">Ещё тест</button><button class="btn grow" type="button" id="tHome">На главную</button></div></div>`;
  if (T.review !== null && T.review !== undefined) {
    const t = T.qs[T.review], a = T.ans[t.id], ok1 = T.res[t.id];
    h += `<div class="card">${taskHtml(t, a !== undefined ? {pick: a, ok: ok1} : null)}<div class="res ${ok1 ? "ok" : "bad"}" style="margin-top:14px"><h3>${ok1 ? "Верно ✓" : a === undefined ? "Без ответа" : "Неверно"} <span style="font-weight:500">${ok1 ? "" : "Правильный ответ: " + (t.c.length ? t.a : fmt(shownAnswer(t.a)))}</span></h3>${explainHtml(t)}</div></div>`;
  } else h += `<p class="muted" style="text-align:center">Нажми на номер, чтобы увидеть разбор.</p>`;
  $("v-test").innerHTML = h;
}
$("v-test").addEventListener("click", e => {
  const l = e.target.closest("[data-tlen]"); if (l) { S.tlen = +l.dataset.tlen; save(); renderTest(); return; }
  if (!T) return;
  const o = e.target.closest(".opt"); if (o && !T.end) { testAnswer(+o.dataset.i); return; }
  const d = e.target.closest("[data-ti]"); if (d) { T.i = +d.dataset.ti; renderTest(); return; }
  if (e.target.closest("#tPrev")) { T.i--; renderTest(); return; }
  if (e.target.closest("#tNext")) { if (T.i < T.qs.length - 1) { T.i++; renderTest(); } else if (confirm("Завершить тест?")) finishTest(); return; }
  if (e.target.closest("#tFlag")) { const id = T.qs[T.i].id; T.flags.has(id) ? T.flags.delete(id) : T.flags.add(id); renderTest(); return; }
  const r = e.target.closest("[data-rv]"); if (r) { T.review = +r.dataset.rv; renderTestResult(); return; }
  if (e.target.closest("#tAgain")) { T = null; renderTest(); return; }
  if (e.target.closest("#tHome")) { T = null; go("home"); return; }
  const k = e.target.closest(".keys button"); if (k) { keyPress(k.dataset.k); return; }
});

/* ---------- server: leaderboard and admin ---------- */
const ONLINE = !!(API && TG && TG.initData);
let syncTimer = null, BOARD = null, IS_ADMIN = false, ADM = null, admSel = null, boardMode = "week";
async function api(path, body){
  const r = await fetch(API + path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(Object.assign({initData: TG.initData}, body || {}))});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
function syncNow(){
  if (!ONLINE) return;
  const ev = S.ev.slice();
  api("/api/sync", {name: S.name, done: packDone(S.done), ev, streak: streakNow()}).then(b => { BOARD = b; IS_ADMIN = !!b.admin; S.ev = S.ev.filter(x => !ev.includes(x)); save(); if (VIEW === "board") renderBoard(); }).catch(() => {});
}
function sendResult(){ clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 1500); }
function renderBoard(){
  const box = $("v-board");
  if (!ONLINE) { box.innerHTML = `<div class="card"><div class="empty">Рейтинг доступен внутри Telegram.</div></div>`; return; }
  if (!BOARD) { box.innerHTML = `<div class="card"><div class="empty">Загружаю…</div></div>`; api("/api/board").then(b => { BOARD = b; IS_ADMIN = !!b.admin; renderBoard(); }).catch(() => { box.innerHTML = `<div class="card"><div class="empty">Не удалось загрузить рейтинг.</div></div>`; }); return; }
  const list = boardMode === "week" ? BOARD.week : BOARD.top, me = boardMode === "week" ? BOARD.meWeek : BOARD.me;
  const rows = (list || []).map(r => `<li class="${r.me ? "me" : ""}"><span class="pl">${r.place}</span><span class="nm">${esc(r.name)}<div class="st">${r.streak ? "🔥 " + r.streak + " · " : ""}попыток ${r.tries}</div></span><b>${r.solved}</b></li>`).join("");
  box.innerHTML = `<div class="card"><h2>Рейтинг</h2><div class="seg"><button class="${boardMode === "week" ? "on" : ""}" data-bm="week" type="button">За 7 дней</button><button class="${boardMode === "all" ? "on" : ""}" data-bm="all" type="button">За всё время</button></div>
    <p class="muted" style="margin:0 0 8px">Сколько разных задач решено верно. Участников: ${BOARD.total}</p>
    ${rows ? `<ol class="lb">${rows}</ol>` : `<div class="empty">Пока пусто. Реши первую задачу — и ты в таблице.</div>`}
    ${me && !(list || []).some(r => r.me) ? `<p class="muted" style="margin:10px 0 0">Ты на ${me.place}-м месте · решено ${me.solved}</p>` : ""}</div>` +
    (IS_ADMIN ? `<div class="card"><h2>Админка</h2><div id="adm"></div></div>` : "");
  if (IS_ADMIN) renderAdmin();
}
$("v-board").addEventListener("click", e => { const b = e.target.closest("[data-bm]"); if (b) { boardMode = b.dataset.bm; renderBoard(); } });
function userStats(u){
  const res = u.results.filter(r => byId[r[0]]);
  const solved = res.filter(r => r[2] > 0).length, wrong = res.filter(r => r[3] === 0);
  const tries = res.reduce((a, r) => a + r[1], 0);
  return {res, solved, wrong, tries, pct: res.length ? Math.round(100 * res.filter(r => r[3] === 1).length / res.length) : 0};
}
const ago = ms => { const m = Math.round((Date.now() - ms) / 60000); return m < 60 ? m + " мин" : m < 1440 ? Math.round(m / 60) + " ч" : Math.round(m / 1440) + " дн"; };
function renderAdmin(){
  const box = $("adm"); if (!box) return;
  if (!ADM) { box.innerHTML = '<p class="muted">Загружаю…</p>'; api("/api/admin/users").then(d => { ADM = d.users; renderAdmin(); }).catch(() => { box.innerHTML = '<p class="muted">Не удалось загрузить.</p>'; }); return; }
  if (admSel) {
    const u = ADM.find(x => x.uid === admSel); if (!u) { admSel = null; return renderAdmin(); }
    const st = userStats(u);
    const bySkill = Object.keys(SKILL).map(s => { const r = st.res.filter(x => byId[x[0]].s === s); return {s, n: r.length, ok: r.filter(x => x[3] === 1).length}; }).filter(x => x.n).sort((a, b) => a.ok / a.n - b.ok / b.n);
    box.innerHTML = `<div class="nav"><button class="btn sm ghost" type="button" data-a="back">← Все ученики</button></div>
      <h3>${esc(u.name)} ${u.username ? `<span class="muted">@${esc(u.username)}</span>` : ""}</h3>
      <p class="muted">Решено верно ${st.solved} · попыток ${st.tries} · верно сейчас ${st.pct}% · был ${ago(u.last)} назад${u.streak ? " · 🔥 " + u.streak : ""}</p>
      <table class="adm-t"><thead><tr><th>Тема</th><th>Верно</th></tr></thead><tbody>${bySkill.map(x => `<tr><td>${SKILL[x.s]}</td><td>${x.ok}/${x.n}</td></tr>`).join("") || '<tr><td colspan="2">Пока ничего не решал</td></tr>'}</tbody></table>
      ${st.wrong.length ? `<p class="muted" style="margin-top:12px">Ошибки (нажми, чтобы открыть задачу):</p><div class="list">${st.wrong.map(r => `<button type="button" class="cell bad" data-open="${r[0]}">№${r[0]}</button>`).join("")}</div>` : ""}
      <div class="actions"><button class="btn sm ghost" type="button" data-a="hide" data-u="${u.uid}">${u.hidden ? "Показать в рейтинге" : "Скрыть из рейтинга"}</button><button class="btn sm ghost" type="button" data-a="rename" data-u="${u.uid}">Переименовать</button><button class="btn sm ghost" type="button" data-a="del" data-u="${u.uid}">Удалить</button></div><div id="admForm"></div>`;
    return;
  }
  box.innerHTML = `<p class="muted">Учеников: ${ADM.length}. Нажми на имя — темы и ошибки.</p>
    <table class="adm-t"><thead><tr><th>Имя</th><th>Верно</th><th>%</th><th>Был</th><th></th></tr></thead><tbody>` +
    ADM.map(u => { const st = userStats(u); return `<tr class="${u.hidden ? "hid" : ""}"><td><button type="button" class="lnk" data-a="open" data-u="${u.uid}">${esc(u.name)}</button></td><td>${st.solved}</td><td>${st.pct}</td><td>${ago(u.last)}</td><td><button type="button" class="lnk" data-a="hide" data-u="${u.uid}">${u.hidden ? "показать" : "скрыть"}</button></td></tr>`; }).join("") + `</tbody></table>`;
}
let delArm = null;
$("v-board").addEventListener("click", e => {
  const c = e.target.closest("#adm [data-open]"); if (c) { go("practice"); openTask(+c.dataset.open); return; }
  const b = e.target.closest("#adm [data-a]"); if (!b) return;
  const uid = +b.dataset.u, u = ADM && ADM.find(x => x.uid === uid), a = b.dataset.a;
  if (a === "back") { admSel = null; renderAdmin(); }
  if (a === "open") { admSel = uid; renderAdmin(); }
  if (a === "hide" && u) { u.hidden = u.hidden ? 0 : 1; renderAdmin(); api("/api/admin/hide", {uid, hidden: !!u.hidden}).then(() => { BOARD = null; }).catch(() => {}); }
  if (a === "rename" && u) { $("admForm").innerHTML = `<form class="gi" id="renf"><input id="rni" maxlength="30" value="${esc(u.name)}"><button class="btn" type="submit">Сохранить</button></form>`; $("renf").onsubmit = ev => { ev.preventDefault(); const n = $("rni").value.trim(); if (!n) return; u.name = n; api("/api/admin/rename", {uid, name: n}).catch(() => {}); renderAdmin(); }; }
  if (a === "del" && u) { if (delArm !== uid) { delArm = uid; b.textContent = "Точно удалить? Нажми ещё раз"; return; } delArm = null; ADM = ADM.filter(x => x.uid !== uid); admSel = null; api("/api/admin/delete", {uid}).catch(() => {}); renderAdmin(); }
});

/* ---------- start ---------- */
function showName(){
  $("nameScreen").hidden = false; $("app").hidden = true; $("tabs").hidden = true;
  $("ni").value = S.name || S.suggest || ""; setTimeout(() => $("ni").focus(), 0);
}
function startApp(){
  $("nameScreen").hidden = true; $("app").hidden = false; $("tabs").hidden = false;
  $("who").hidden = false; $("who").textContent = S.name;
  go("home"); syncNow();
}
$("nf").addEventListener("submit", e => { e.preventDefault(); const n = $("ni").value.trim(); if (!n) return; S.name = n; save(); startApp(); });
$("who").addEventListener("click", showName);
if (TG) { try { TG.ready(); TG.expand(); } catch(e) {} }
async function boot(){
  if (!TASKS) { try { TASKS = await (await fetch(DATA_URL)).json(); } catch(e) { $("loading").textContent = "Не удалось загрузить задачи. Проверь интернет и открой заново."; return; } }
  TASKS.forEach(t => { byId[t.id] = t; });
  await load();
  $("loading").hidden = true;
  S.name ? startApp() : showName();
}
boot();
</script>
