 to function f, where k and m are constants. Which of the following equations displays the y-coordinate of the y-intercept of the graph of y = f(x) in the xy-plane as a constant or coefficient?\nI. g(x) = a(2.2ˣ + k)\nII. h(x) = a(2.2)ˣ + m","c":["I only","II only","I and II","Neither I nor II"],"a":"D","e":"f(0) = a(1 + 2.2ᵇ).\nВ I при x = 0: a(1 + k), в II: a + m — ни одна константа не равна f(0)."},{"id":214,"s":"nonlinear_functions","t":"interpreting vertex of a parabola in context","d":"m","q":"A physics class is planning an experiment about a toy rocket. The equation y = −16(x − 5.6)² + 502 gives the estimated height y, in feet, of the toy rocket x seconds after it is launched into the air. Which of the following is the best interpretation of the vertex of the graph of the equation in the xy-plane?","c":["This toy rocket reaches an estimated maximum height of 502 feet 16 seconds after it is launched into the air.","This toy rocket reaches an estimated maximum height of 502 feet 5.6 seconds after it is launched into the air.","This toy rocket reaches an estimated maximum height of 16 feet 502 seconds after it is launched into the air.","This toy rocket reaches an estimated maximum height of 5.6 feet 502 seconds after it is launched into the air."],"a":"B","e":"Вершина (5.6, 502): максимум 502 фута через 5.6 с."},{"id":218,"s":"nonlinear_functions","t":"exponential function, y-intercept after translation","d":"h","q":"Function f is defined by f(x) = −aˣ + b, where a and b are constants. In the xy-plane, the graph of y = f(x) − 12 has a y-intercept at (0, −75/7). The product of a and b is 320/7. What is the value of a?","c":[],"a":"20","e":"f(0) − 12 = −1 + b − 12 = −75/7 → b = 16/7.\na = (320/7) : (16/7) = 20."},{"id":219,"s":"study_design","t":"generalizing survey results from random sample to population","d":"h","q":"A sample of 40 fourth-grade students was selected at random from a certain school. The 40 students completed a survey about the morning announcements, and 32 thought the announcements were helpful. Which of the following is the largest population to which the results of the survey can be applied?","c":["The 40 students who were surveyed","All fourth-grade students at the school","All students at the school","All fourth-grade students in the county in which the school is located"],"a":"B","e":"Выборка из 4-классников этой школы → вывод только на них."},{"id":220,"s":"study_design","t":"interpreting random sample survey results, which statements must be true","d":"m","q":"Residents of a town were surveyed to determine whether they are satisfied with the concession stand at the local park. A random sample of 200 residents was selected. All 200 responded, and 87% said they are satisfied. Based on this information, which of the following statements must be true?\nI. Of all the town residents, 87% would say they are satisfied with the concession stand at the local park.\nII. If another random sample of 200 residents were surveyed, 87% would say they are satisfied.","c":["Neither","I only","II only","I and II"],"a":"A","e":"Выборка даёт оценку, а не точное значение. Ни I, ни II не обязаны быть верны."},{"id":221,"s":"study_design","t":"generalizing survey results from random sample to population","d":"m","q":"A survey was conducted using a sample of history professors selected at random from the California State Universities. The professors surveyed were asked to name the publishers of their current texts. What is the largest population to which the results of the survey can be generalized?","c":["All professors in the United States","All history professors in the United States","All history professors at all California State Universities","All professors at all California State Universities"],"a":"C","e":"Выбирали history professors из California State Universities → на них и обобщаем."},{"id":223,"s":"study_design","t":"generalizing study results from random sample","d":"h","q":"A psychologist designed and conducted a study to determine whether playing a certain educational game increases middle school students’ accuracy in adding fractions. For the study, the psychologist chose a random sample of 35 students from all of the students at one of the middle schools in a large city. The psychologist found that students who played the game showed significant improvement in accuracy when adding fractions. What is the largest group to which the results of the study can be generalized?","c":["The 35 students in the sample","All students at the school","All middle school students in the city","All students in the city"],"a":"B","e":"Выборка из одной школы → вывод на всех учеников этой школы."},{"id":224,"s":"study_design","t":"interpreting random sample survey results, which statements must be true","d":"m","q":"A polling agency recently surveyed 1,000 adults who were selected at random from a large city and asked each of the adults, “Are you satisfied with the quality of air in the city?” Of those surveyed, 78 percent responded that they were satisfied with the quality of air in the city. Based on the results of the survey, which of the following statements must be true?\n1. Of all adults in the city, 78 percent are satisfied with the quality of air in the city.\n2. If another 1,000 adults selected at random from the city were surveyed, 78 percent of them would report they are satisfied with the quality of air in the city.\n3. If 1,000 adults selected at random from a different city were surveyed, 78 percent of them would report they are satisfied with the quality of air in the city.","c":["None","II only","I and II only","I and III only"],"a":"A","e":"Опрос даёт оценку, а не гарантию. Ни одно утверждение не обязано быть верным."},{"id":226,"s":"study_design","t":"biased sample, voluntary response poll","d":"h","q":"Near the end of a US cable news show, the host invited viewers to respond to a poll on the show’s website that asked, “Do you support the new federal policy discussed during the show?” At the end of the show, the host reported that 28% responded “Yes,” and 70% responded “No.” Which of the following best explains why the results are unlikely to represent the sentiments of the population of the United States?","c":["The percentages do not add up to 100%, so any possible conclusions from the poll are invalid.","Those who responded to the poll were not a random sample of the population of the United States.","There were not 50% “Yes” responses and 50% “No” responses.","The show did not allow viewers enough time to respond to the poll."],"a":"B","e":"Отвечали сами желающие зрители → не случайная выборка."},{"id":227,"s":"study_design","t":"biased sampling method, estimating population mean","d":"h","q":"To determine the mean number of children per household in a community, Tabitha surveyed 20 families at a playground. For the 20 families surveyed, the mean number of children per household was 2.4. Which of the following statements must be true?","c":["The mean number of children per household in the community is 2.4.","A determination about the mean number of children per household in the community should not be made because the sample size is too small.","The sampling method is flawed and may produce a biased estimate of the mean number of children per household in the community.","The sampling method is not flawed and is likely to produce an unbiased estimate of the mean number of children per household in the community."],"a":"C","e":"Семьи на детской площадке чаще с детьми → выборка смещена."},{"id":228,"s":"study_design","t":"generalizing experiment results from random selection","d":"h","q":"For a baobab tree habitat in South Africa, a scientist randomly selected 50 baobab trees that were 17 years old and randomly assigned them to two groups. Each group was subjected to a different watering pattern for 2 consecutive years to observe whether the watering pattern affects the trees’ growth rate. Based on the design of the study, what is the largest group to which these results can be applied?","c":["All the 50 baobab trees that were selected in this habitat","All the baobab trees that were 19 years old in this habitat","All the baobab trees that were 17 years old in South Africa","All the baobab trees that were 17 years old in this habitat"],"a":"D","e":"Случайно брали 17-летние баобабы этой местности → на них и обобщаем."},{"id":229,"s":"one_var_data","t":"median of data set with even number of values","d":"m","q":"4, 10, 18, 4, 4, 5, 6, 5\nWhat is the median of the data set shown?","c":["4","5","7","14"],"a":"B","e":"По порядку: 4, 4, 4, 5, 5, 6, 10, 18.\nМедиана: (5 + 5)/2 = 5."},{"id":236,"s":"one_var_data","t":"mean equals median, unknown value","d":"m","q":"15, 14, 18, 17, x\nThe mean and the median of the five numbers above are equal. Which of the following is NOT a possible value of x ?","c":["6","11","16","21"],"a":"A","e":"Проверим x = 6: числа 6, 14, 15, 17, 18, медиана 15, среднее 70/5 = 14 ≠ 15.\nДля 11, 16, 21 среднее = медиане."},{"id":237,"s":"one_var_data","t":"mean with unknown value, integer constraints","d":"h","q":"Data set A consists of 10 positive integers less than 60. The list shown gives 9 of the integers from data set A.\n43, 45, 44, 43, 38, 39, 40, 46, 40\nThe mean of these 9 integers is 42. If the mean of data set A is an integer that is greater than 42, what is the value of the largest integer from data set A?","c":[],"a":"52","e":"Сумма 9 чисел: 9 · 42 = 378.\n(378 + x)/10 — целое > 42 и x < 60 → x = 52 (среднее 43)."},{"id":240,"s":"one_var_data","t":"effect of transformation on median, mean, sum, standard deviation","d":"h","q":"A data set of 27 different numbers has a mean of 33 and a median of 33. A new data set is created by adding 7 to each number in the original data set that is greater than the median and subtracting 7 from each number in the original data set that is less than the median. Which of the following measures does NOT have the same value in both the original and new data sets?","c":["Median","Mean","Sum of the numbers","Standard deviation"],"a":"D","e":"Медиана и сумма (значит, и среднее) не меняются.\nЧисла стали дальше от центра → SD выросло."},{"id":241,"s":"one_var_data","t":"smallest standard deviation","d":"m","q":"Which of the following lists represents a data set with the smallest standard deviation?","c":["51, 52, 54, 56, 57","52, 52, 54, 56, 56","52, 53, 54, 55, 56","53, 54, 54, 54, 55"],"a":"D","e":"SD — разброс от среднего. Самые «кучные» числа: 53, 54, 54, 54, 55."},{"id":249,"s":"percentages","t":"percent as linear relationship, expressing p in terms of x","d":"h","q":"Jennifer bought a box of Crunchy Grain cereal. The nutrition facts on the box state that a serving size of the cereal is 3/4 cup and provides 210 calories, 50 of which are calories from fat. In addition, each serving of the cereal provides 180 milligrams of potassium, which is 5% of the daily allowance for adults. If p percent of an adult’s daily allowance of potassium is provided by x servings of Crunchy Grain cereal per day, which of the following expresses p in terms of x?","c":["p = 0.5x","p = 5x","p = (0.05)ˣ","p = (1.05)ˣ"],"a":"B","e":"1 порция = 5% → x порций = 5x%.\nОстальные числа в условии лишние."},{"id":250,"s":"percentages","t":"percent decrease expression","d":"h","q":"The expression 0.35x represents the result of decreasing a positive quantity x by what percent?","c":["3.5%","35%","6.5%","65%"],"a":"D","e":"0.35x = x − 0.65x → уменьшили на 65%."},{"id":251,"s":"percentages","t":"percent of a total, finding difference between groups","d":"h","q":"A school district is forming a committee to discuss plans for the construction of a new high school. Of those invited to join the committee, 15% are parents of students, 45% are teachers from the current high school, 25% are school and district administrators, and the remaining 6 individuals are students. How many more teachers were invited to join the committee than school and district administrators?","c":[],"a":"8","e":"15 + 45 + 25 = 85% → студенты 15% = 6 человек → всего 40.\nУчителя − админы = 20% · 40 = 8."},{"id":252,"s":"percentages","t":"finding total from percent","d":"m","q":"In a sample, 80% of the items are faulty. There are 88 faulty items in the sample. How many total items are in the sample?","c":[],"a":"110","e":"0.8 · N = 88 → N = 110."},{"id":253,"s":"percentages","t":"percent increase and scale drawing","d":"h","q":"A square scale drawing has a side length of 55 inches, and 1 inch on the drawing represents an actual distance of 19 miles. A larger version of the same drawing is printed as a square with the side length 65% longer than the side length of the previous drawing. On the larger drawing, which of the following is closest to the actual distance, in miles, represented by 1 inch?","c":["6.65","11.52","31.35","35.75"],"a":"B","e":"Сторона в 1.65 раза больше, расстояние то же.\n19/1.65 ≈ 11.52 мили на дюйм."},{"id":254,"s":"percentages","t":"percent of percent, what percent of b is a","d":"h","q":"The positive number a is 2,241% of the sum of the positive numbers b and c, and b is 83% of c. What percent of b is a?","c":["23.24%","49.41%","2,324%","4,941%"],"a":"D","e":"c = b/0.83 ≈ 1.2048b.\na = 22.41 · (b + 1.2048b) ≈ 49.41b → 4941%."},{"id":257,"s":"percentages","t":"chained percent relationships","d":"h","q":"The positive number a is 230% of the number b, and a is 60% of the number c. If c is p% of b, which of the following is closest to the value of p?","c":["138","217","283","383"],"a":"D","e":"2.3b = 0.6c → c = (2.3/0.6)b ≈ 3.83b → p ≈ 383."},{"id":258,"s":"percentages","t":"successive percentages of a count","d":"m","q":"An insurance company offers a series of three information sessions. 1,250 people attended the first information session. 72% of the people who attended the first information session attended the second information session, and 36% of the people who attended the first and second information sessions attended the third information session. How many people attended all three information sessions?","c":[],"a":"324","e":"1250 · 0.72 = 900, 900 · 0.36 = 324."},{"id":259,"s":"percentages","t":"percent of units returned over multiple months","d":"m","q":"During the first month of sales, a company sold 1,300,000 units of a certain type of smartphone. During the same month, 15% of the units sold were returned. If sales and the return rate remain the same for each of the next 5 months, about how many units of this smartphone will be returned to the company during this 6-month period?","c":["195,000","975,000","1,170,000","6,630,000"],"a":"C","e":"6 месяцев · 1 300 000 · 0.15 = 1 170 000."},{"id":260,"s":"percentages","t":"chained percent relationships with expression","d":"h","q":"The speeds of objects A, B, and C are a meters per second, b meters per second, and c meters per second, respectively. If the speed of object A is 5,900% of the speed of object C and the speed of object C is 0.008% of the speed of object B, which expression represents the value of a + b in terms of c?","c":["1,840c","5,908c","6,025c","12,559c"],"a":"D","e":"a = 59c, c = 0.00008b → b = 12 500c.\na + b = 12 559c."},{"id":261,"s":"percentages","t":"percent increase of a quantity","d":"m","q":"Last year, Cedric had 35 plants in his garden. This year, the number of plants in Cedric’s garden is 60% greater than the number of plants in his garden last year. How many plants does Cedric have in his garden this year?","c":[],"a":"56","e":"35 · 1.6 = 56."},{"id":262,"s":"percentages","t":"percent greater and percent less","d":"h","q":"The number a is 190% greater than the number b. The number b is 80% less than 24. What is the value of a?","c":["9.12","13.92","26.40","36.48"],"a":"B","e":"b = 24 · 0.2 = 4.8 (на 80% меньше).\na = 4.8 · 2.9 = 13.92 (на 190% больше → × 2.9)."},{"id":263,"s":"percentages","t":"expression for percent increase","d":"m","q":"Which expression represents the result of increasing a positive quantity w by 43%?","c":["1.43w","0.57w","43w","0.43w"],"a":"A","e":"Рост на 43% → × 1.43."},{"id":264,"s":"percentages","t":"percent increase as multiplier","d":"m","q":"The population of City A increased by 7% from 2015 to 2016. If the 2016 population is k times the 2015 population, what is the value of k?","c":["0.07","0.7","1.07","1.7"],"a":"C","e":"Рост на 7% → × 1.07."},{"id":265,"s":"percentages","t":"expression for percent increase","d":"m","q":"Which of the following represents the result of increasing the quantity x by 9%, where x > 0?","c":["1.09x","0.09x","x + 9","x + 0.09"],"a":"A","e":"Рост на 9% → × 1.09."},{"id":266,"s":"percentages","t":"percent greater, finding multiplier","d":"m","q":"The number k is 36% greater than 50. If k is the product of 50 and r, what is the value of r?","c":["36","3.6","1.36","0.36"],"a":"C","e":"k = 50 · 1.36 → r = 1.36."},{"id":267,"s":"percentages","t":"successive percent increases","d":"h","q":"In 2008, Zinah earned 14% more than in 2007, and in 2009 Zinah earned 4% more than in 2008. If Zinah earned y times as much in 2009 as in 2007, what is the value of y?","c":["0.5600","1.0056","1.1800","1.1856"],"a":"D","e":"1.14 · 1.04 = 1.1856."},{"id":268,"s":"percentages","t":"percent less then percent greater, finding ratio","d":"h","q":"The number a is 70% less than the positive number b. The number c is 80% greater than a. The number c is how many times b?","c":[],"a":".54, 27/50","e":"a = 0.3b, c = 1.8a = 0.54b."},{"id":273,"s":"probability","t":"simple probability, complement event","d":"m","q":"In a bag, there are 7 red, 4 white, 33 blue, and 33 yellow cubes. If one of these cubes is selected at random, what is the probability of selecting a cube that is neither blue nor yellow?","c":["6/7","7/11","1/3","1/7"],"a":"D","e":"Не синие и не жёлтые: 7 + 4 = 11 из 77.\n11/77 = 1/7."},{"id":274,"s":"probability","t":"conditional probability, counting","d":"h","q":"A grove has 6 rows of birch trees and 5 rows of maple trees. Each row of birch trees has 8 trees 20 feet or taller and 6 trees shorter than 20 feet. Each row of maple trees has 9 trees 20 feet or taller and 7 trees shorter than 20 feet. A tree from one of these rows will be selected at random. What is the probability of selecting a maple tree, given that the tree is 20 feet or taller?","c":["9/164","3/10","15/31","9/17"],"a":"C","e":"Высоких клёнов: 5 · 9 = 45, высоких берёз: 6 · 8 = 48.\n45/(45 + 48) = 45/93 = 15/31."},{"id":276,"s":"probability","t":"probability, find count from probabilities","d":"m","q":"At a movie theater, there are a total of 350 customers. Each customer is located in either theater A, theater B, or theater C. If one of these customers is selected at random, the probability of selecting a customer who is located in theater A is 0.48, and the probability of selecting a customer who is located in theater B is 0.24. How many customers are located in theater C?","c":["28","40","84","98"],"a":"D","e":"P(C) = 1 − 0.48 − 0.24 = 0.28.\n0.28 · 350 = 98."},{"id":277,"s":"probability","t":"simple probability","d":"m","q":"Each vertex of a 14-sided polygon is labeled with one of the 14 letters A through N, with a different letter at each vertex. If one vertex is selected at random, what is the probability that the letter D will be at the selected vertex? (Express your answer as a decimal or fraction, not as a percent.)","c":[],"a":"1/14","e":"Одна вершина из 14 → 1/14."},{"id":278,"s":"probability","t":"probability, solve for count","d":"h","q":"On May 10, 2015, there were 83 million Internet subscribers in Nigeria. The major Internet providers were MTN, Globacom, Airtel, Etisalat, and Visafone. By September 30, 2015, the number of Internet subscribers in Nigeria had increased to 97 million. If an Internet subscriber in Nigeria on September 30, 2015, is selected at random, the probability that the person selected was an MTN subscriber is 0.43. There were p million MTN subscribers in Nigeria on September 30, 2015. To the nearest integer, what is the value of p ?","c":[],"a":"42","e":"0.43 · 97 = 41.71 ≈ 42."},{"id":282,"s":"probability","t":"probability with number sets","d":"h","q":"Set K consists of all the positive integers that are less than or equal to 160, where none of the integers are repeated. If a number is selected at random from set K, what is the probability of selecting a number that is even and less than or equal to 50?","c":["5/32","3/16","5/21","5/16"],"a":"A","e":"Чётных до 50: 25.\n25/160 = 5/32."},{"id":283,"s":"probability","t":"probability, find count from probabilities","d":"m","q":"At a conference, there are a total of 275 attendees. Each attendee is assigned to either group A, group B, or group C. If one of these attendees is selected at random, the probability of selecting an attendee who is assigned to group A is 0.44 and the probability of selecting an attendee who is assigned to group B is 0.24. How many attendees are assigned to group C?","c":[],"a":"88","e":"P(C) = 1 − 0.44 − 0.24 = 0.32.\n0.32 · 275 = 88."},{"id":284,"s":"probability","t":"fraction of total, rate","d":"m","q":"If 1,200 customers register for new accounts at a social media website every day, what fraction of the first 60,000 new accounts are registered in the first 5 days?","c":["1/5","1/10","1/12","1/50"],"a":"B","e":"За 5 дней: 5 · 1200 = 6000.\n6000/60000 = 1/10."},{"id":289,"s":"ratios_rates_units","t":"unit conversion, speed miles per second to miles per hour","d":"m","q":"The International Space Station orbits Earth at an average speed of 4.76 miles per second. What is the space station’s average speed in miles per hour?","c":["285.6","571.2","856.8","17,136.0"],"a":"D","e":"В часе 3600 с: 4.76 · 3600 = 17 136."},{"id":290,"s":"ratios_rates_units","t":"population density and land area","d":"m","q":"The population density of Iceland, in people per square kilometer of land area, increased from 2.5 in 1990 to 3.3 in 2014. During this time period, the land area of Iceland was 100,250 square kilometers. By how many people did Iceland’s population increase from 1990 to 2014?","c":["330,825","132,330","125,312","80,200"],"a":"D","e":"Плотность выросла на 0.8 чел/км².\n0.8 · 100 250 = 80 200."},{"id":291,"s":"ratios_rates_units","t":"equivalent ratios, solve for m","d":"m","q":"The ratio 140 to m is equivalent to the ratio 4 to 28. What is the value of m?","c":[],"a":"980","e":"140/m = 4/28 = 1/7 → m = 980."},{"id":292,"s":"ratios_rates_units","t":"unit conversion, quarts to fluid ounces","d":"m","q":"How many fluid ounces are equivalent to 76 quarts? (8 fluid ounces = 1 cup and 4 cups = 1 quart)","c":[],"a":"2432","e":"76 quarts · 4 = 304 cups, · 8 = 2432 fl oz."},{"id":293,"s":"ratios_rates_units","t":"ratio equations, solve for n","d":"m","q":"If x/y = 4 and 24x/(ny) = 4, what is the value of n?","c":[],"a":"24","e":"24x/(ny) = (24/n) · (x/y) = (24/n) · 4 = 4.\nn = 24."},{"id":294,"s":"ratios_rates_units","t":"density and unit price, dollars per cubic inch","d":"m","q":"Pure beeswax has a density of 0.555 ounce per cubic inch. An online company sells pure beeswax at a price of $8.00 per ounce. What is the selling price, in dollars per cubic inch, for pure beeswax purchased from this company?","c":[],"a":"4.44","e":"1 in³ = 0.555 oz → 0.555 · 8 = $4.44."},{"id":295,"s":"ratios_rates_units","t":"equivalent ratios, solve for y","d":"m","q":"The ratio x to y is equivalent to the ratio 9 to 5. If the value of x is 162, what is the value of y?","c":[],"a":"90","e":"x/y = 9/5 → y = 162 · 5/9 = 90."},{"id":296,"s":"ratios_rates_units","t":"density, mass of a cube","d":"h","q":"A sample of oak has a density of 807 kilograms per cubic meter. The sample is in the shape of a cube, where each edge has a length of 0.90 meters. To the nearest whole number, what is the mass, in kilograms, of this sample?","c":["588","726","897","1,107"],"a":"A","e":"V = 0.9³ = 0.729 м³.\nm = 807 · 0.729 ≈ 588."},{"id":297,"s":"ratios_rates_units","t":"ratio expression in terms of variable","d":"m","q":"At a particular track meet, the ratio of coaches to athletes is 1 to 26. If there are x coaches at the track meet, which of the following expressions represents the number of athletes at the track meet?","c":["x/26","26x","x + 26","26/x"],"a":"B","e":"На каждого тренера 26 атлетов → 26x."},{"id":298,"s":"ratios_rates_units","t":"scale model ratio expression","d":"h","q":"In a scale model of an office building, a length of 1 inch is equivalent to a length of 17/3 feet in the actual office building. If a length in the actual office building measures x feet, which expression represents the corresponding length, in inches, in the model in terms of x?","c":["3x/((17)(12))","17x/((12)(3))","3x/17","17x/3"],"a":"C","e":"1 дюйм = 17/3 фута → x футов = x : (17/3) = 3x/17 дюймов."},{"id":299,"s":"ratios_rates_units","t":"average speed, miles per hour","d":"m","q":"On April 18, 1775, Paul Revere set off on his midnight ride from Charlestown to Lexington. If he had ridden straight to Lexington without stopping, he would have traveled 11 miles in 26 minutes. In such a ride, what would the average speed of his horse have been, to the nearest tenth of a mile per hour?","c":[],"a":"25.4","e":"26 мин = 26/60 ч.\n11 : (26/60) ≈ 25.4 миль/ч."},{"id":300,"s":"ratios_rates_units","t":"unit conversion of acceleration","d":"h","q":"The speed of a vehicle is increasing at a rate of 7.3 meters per second squared. What is this rate, in miles per minute squared, rounded to the nearest tenth? (Use 1 mile = 1,609 meters.)","c":["0.3","16.3","195.8","220.4"],"a":"B","e":"с² → мин²: × 60² = 3600: 7.3 · 3600 = 26 280 м/мин².\n26280/1609 ≈ 16.3."},{"id":301,"s":"ratios_rates_units","t":"same ratio of rectangles, width in terms of w","d":"m","q":"Rectangle A has length 15 and width w. Rectangle B has length 20 and the same length-to-width ratio as rectangle A. What is the width of rectangle B in terms of w ?","c":["(4/3)w","w + 5","(3/4)w","w − 5"],"a":"A","e":"Длина выросла в 20/15 = 4/3 раза, ширина тоже → (4/3)w."},{"id":302,"s":"ratios_rates_units","t":"proportional relationship","d":"m","q":"There is a proportional relationship between p and t. If p = 5,130 when t = 6,840, then what is the value of p when t = 5,472?","c":["7,296","7,182","4,104","3,762"],"a":"C","e":"p/t = 5130/6840 = 0.75.\np = 0.75 · 5472 = 4104."},{"id":303,"s":"ratios_rates_units","t":"density from mass and volume","d":"m","q":"An object has a mass of 168 grams and a volume of 24 cubic centimeters. What is the density, in grams per cubic centimeter, of the object?","c":["7","144","192","4,032"],"a":"A","e":"ρ = m/V = 168/24 = 7."},{"id":304,"s":"ratios_rates_units","t":"exponential doubling, solve for initial amount","d":"h","q":"Jeremy deposited x dollars in his investment account on January 1, 2001. The amount of money in the account doubled each year until Jeremy had 480 dollars in his investment account on January 1, 2005. What is the value of x ?","c":[],"a":"30","e":"С 2001 по 2005 — 4 удвоения: 16x = 480 → x = 30."},{"id":305,"s":"ratios_rates_units","t":"constant hourly rate, expression","d":"m","q":"Tanya earns $13.50 per hour at her part-time job. When she works z hours, she earns 13.50z dollars. Which of the following expressions gives the amount, in dollars, Tanya will earn if she works 3z hours?","c":["3(13.50z)","3 + 13.50z","3z + 13.50z","13.50(z + 3)"],"a":"A","e":"3z часов = в 3 раза больше: 3(13.50z)."},{"id":307,"s":"ratios_rates_units","t":"ratio equations, solve for n","d":"h","q":"If 4a/b = 6.7 and a/(bn) = 26.8, what is the value of n?","c":[],"a":".0625, 1/16","e":"a/b = 6.7/4 = 1.675.\n1.675/n = 26.8 → n = 0.0625 = 1/16."},{"id":308,"s":"ratios_rates_units","t":"rates, orbit periods","d":"m","q":"One of a planet's moons orbits the planet every 252 days. A second moon orbits the planet every 287 days. How many more days does it take the second moon to orbit the planet 29 times than it takes the first moon to orbit the planet 29 times?","c":[],"a":"1015","e":"Разница за 1 оборот: 35 дней. 35 · 29 = 1015."},{"id":310,"s":"right_triangles_trig","t":"sine of corresponding angles in similar right triangles","d":"m","q":"Triangle FGH is similar to triangle JKL, where angle F corresponds to angle J and angles G and K are right angles. If sin(F) = 308/317, what is the value of sin(J)?","c":["75/317","308/317","317/308","317/75"],"a":"B","e":"Подобные → углы F и J равны → sin(J) = 308/317."},{"id":311,"s":"right_triangles_trig","t":"sine and cosine of complementary angles","d":"m","q":"In right triangle RST, the sum of the measures of angle R and angle S is 90 degrees. The value of sin(R) is √15/4. What is the value of cos(S)?","c":["√15/15","√15/4","4√15/15","√15"],"a":"B","e":"R + S = 90° → cos(S) = sin(R) = √15/4."},{"id":312,"s":"right_triangles_trig","t":"tangent ratio, perimeter of right triangle","d":"h","q":"In triangle XYZ, angle Z is a right angle and the length of YZ is 24 units. If tan X = 12/35, what is the perimeter, in units, of triangle XYZ?","c":["188","168","84","71"],"a":"B","e":"tan X = YZ/XZ = 12/35, YZ = 24 → XZ = 70.\nГипотенуза: 74 (тройка 12-35-37 × 2).\nP = 24 + 70 + 74 = 168."},{"id":314,"s":"right_triangles_trig","t":"cos(Q)=sin(R), complementary angles","d":"h","q":"For two acute angles, ∠Q and ∠R, cos(Q) = sin(R). The measures, in degrees, of ∠Q and ∠R are x + 52 and 4x + 13, respectively. What is the value of x?","c":["5","13","23","38"],"a":"A","e":"cos Q = sin R → Q + R = 90°.\n5x + 65 = 90 → x = 5."},{"id":317,"s":"right_triangles_trig","t":"tangent and area of right triangle","d":"h","q":"In triangle XYZ, angle Y is a right angle, the measure of angle Z is 33°, and the length of YZ is 26 units. If the area, in square units, of triangle XYZ can be represented by the expression k tan 33°, where k is a constant, what is the value of k?","c":[],"a":"338","e":"tan 33° = XY/YZ → XY = 26 tan 33°.\nS = ½ · 26 · 26 tan 33° = 338 tan 33°."},{"id":320,"s":"right_triangles_trig","t":"isosceles right triangle perimeter, hypotenuse","d":"h","q":"The perimeter of an isosceles right triangle is 18 + 18√2 inches. What is the length, in inches, of the hypotenuse of this triangle?","c":["9","9√2","18","18√2"],"a":"C","e":"Катеты a, гипотенуза a√2: a(2 + √2) = 18(1 + √2).\na = 18/√2 = 9√2 → гипотенуза 9√2 · √2 = 18."},{"id":323,"s":"right_triangles_trig","t":"cosine ratio and side length","d":"m","q":"In △ABC, ∠B is a right angle and the length of BC is 136 millimeters. If cos A = 3/5, what is the length, in millimeters, of AB?","c":["34","102","136","170"],"a":"B","e":"cos A = AB/AC = 3/5 → треугольник 3-4-5: BC = 4k = 136.\nk = 34 → AB = 3 · 34 = 102."},{"id":327,"s":"right_triangles_trig","t":"equilateral triangle perimeter from height","d":"h","q":"What is the perimeter of an equilateral triangle with a height of 39√3?","c":["117","117√3","234","1,521√3"],"a":"C","e":"h = s√3/2 = 39√3 → s = 78.\nP = 3 · 78 = 234."},{"id":328,"s":"right_triangles_trig","t":"sin p = cos t, radians, function evaluation","d":"h","q":"Acute angle P has a measure of p radians, and acute angle T has a measure of t radians. The function g is defined by g(x) = p(8)ˣ + 6t. If sin p = cos t, which of the following represents the value g(0) in terms of t?","c":["6t + π","6t","5t + π","5t + π/2"],"a":"D","e":"sin p = cos t → p = π/2 − t.\ng(0) = p + 6t = 5t + π/2."},{"id":329,"s":"systems_linear","t":"word problem, trivia score system","d":"m","q":"The score on a trivia game is obtained by subtracting the number of incorrect answers from twice the number of correct answers. If a player answered 40 questions and obtained a score of 50, how many questions did the player answer correctly?","c":[],"a":"30","e":"c + w = 40, 2c − w = 50.\nСкладываем: 3c = 90 → c = 30."},{"id":330,"s":"systems_linear","t":"no solution, find constant","d":"h","q":"48x − 72y = 30y + 24\nry = 1/6 − 16x\nIn the given system of equations, r is a constant. If the system has no solution, what is the value of r?","c":[],"a":"-34","e":"Первое: 48x − 102y = 24. Второе × 3: 48x + 3ry = 1/2.\nНет решений → 3r = −102 → r = −34."},{"id":331,"s":"systems_linear","t":"solve system by substitution","d":"m","q":"y − 9x = 13\n5x = 2y\nWhat is the solution (x, y) to the given system of equations?","c":["(5/2, 1)","(1, 2/5)","(−2, −5)","(−5, −2)"],"a":"C","e":"y = 9x + 13 → 5x = 2(9x + 13) → x = −2, y = −5.\nDesmos: точка пересечения двух прямых."},{"id":332,"s":"systems_linear","t":"solve for y by elimination","d":"m","q":"24x + y = 48\n6x + y = 72\nThe solution to the given system of equations is (x, y). What is the value of y?","c":[],"a":"80","e":"Вычитаем: 18x = −24 → x = −4/3.\ny = 72 − 6x = 80."},{"id":333,"s":"systems_linear","t":"word problem, ticket prices","d":"h","q":"A movie theater sells two types of tickets, adult tickets for $12 and child tickets for $8. If the theater sold 30 tickets for a total of $300, how much, in dollars, was spent on adult tickets? (Disregard the $ sign when gridding your answer.)","c":[],"a":"180","e":"a + c = 30, 12a + 8c = 300 → 4a = 60 → a = 15.\nНа взрослые: 15 · 12 = 180."},{"id":335,"s":"systems_linear","t":"solve for y by substitution","d":"m","q":"y = 9x + 12\nx + 7y = 20\nThe solution to the given system of equations is (x, y). What is the value of y?","c":[],"a":"3","e":"x + 7(9x + 12) = 20 → 64x = −64 → x = −1.\ny = 3."},{"id":336,"s":"systems_linear","t":"solve for x by elimination","d":"m","q":"x + 2y = 6\nx − 2y = 4\nThe solution to the given system of equations is (x, y). What is the value of x?","c":["2.5","5","6","10"],"a":"B","e":"Складываем: 2x = 10 → x = 5."},{"id":337,"s":"systems_linear","t":"no solution, find constant","d":"h","q":"6 + 7r = pw\n7r − 5w = 5w + 11\nIn the given system of equations, p is a constant. If the system has no solution, what is the value of p?","c":[],"a":"10","e":"7r − pw = −6 и 7r − 10w = 11.\nНет решений → одинаковые коэффициенты: p = 10."},{"id":338,"s":"systems_linear","t":"infinitely many solutions, equivalent equation","d":"m","q":"−15x + 25y = 65\nOne of the two equations in a system of linear equations is given. The system has infinitely many solutions. Which of the following could be the second equation in the system?","c":["12x + 20y = 52","12x + 20y = −52","−12x + 20y = 52","−12x + 20y = −52"],"a":"C","e":"Умножим на 4/5: −12x + 20y = 52 — та же прямая."},{"id":339,"s":"systems_linear","t":"set up system from word problem","d":"m","q":"Ellen bought two types of snack bags for a school event. Each box of chips Ellen bought contained 24 bags and cost $11. Each box of crackers Ellen bought contained 16 bags and cost $9. It cost Ellen $497 before tax to buy 968 bags. If x is the number of boxes of chips and y is the number of boxes of crackers that Ellen bought, which of the following systems of equations represents this situation?","c":["11x + 16y = 968; 24x + 9y = 497","11x + 9y = 968; 24x + 16y = 497","11x + 9y = 497; 24x + 16y = 968","9x + 11y = 497; 16x + 24y = 968"],"a":"C","e":"Деньги: 11x + 9y = 497. Пакеты: 24x + 16y = 968."},{"id":340,"s":"systems_linear","t":"solve system, find x − y","d":"m","q":"y = 3x + 9\n3y = 8x − 6\nThe solution to the given system of equations is (x, y). What is the value of x − y?","c":["−123","−33","3","57"],"a":"D","e":"3(3x + 9) = 8x − 6 → x = −33, y = −90.\nx − y = 57."},{"id":341,"s":"systems_linear","t":"infinitely many solutions, equivalent equation","d":"m","q":"y = 6x + 3\nOne of the two equations in a system of linear equations is given. The system has infinitely many solutions. Which equation could be the second equation in this system?","c":["y = 2(6x) + 3","y = 2(6x + 3)","2(y) = 2(6x) + 3","2(y) = 2(6x + 3)"],"a":"D","e":"Бесконечно много решений → то же уравнение × 2: 2y = 2(6x + 3)."},{"id":342,"s":"systems_linear","t":"word problem, wire cut into two parts","d":"m","q":"A wire with a length of 106 inches is cut into two parts. One part has a length of x inches, and the other part has a length of y inches. The value of x is 6 more than 4 times the value of y. What is the value of x?","c":["25","28","56","86"],"a":"D","e":"x + y = 106, x = 4y + 6 → 5y = 100 → y = 20, x = 86."},{"id":343,"s":"systems_linear","t":"solve system, find product xy","d":"h","q":"5x + 14y = 45\n10x + 7y = 27\nThe solution to the given system of equations is (x, y). What is the value of xy?","c":[],"a":"9/5","e":"Второе × 2 минус первое: 15x = 9 → x = 3/5.\n14y = 45 − 3 = 42 → y = 3. xy = 9/5."},{"id":344,"s":"systems_linear","t":"translate words into system","d":"m","q":"The sum of a number x and 7 is twice as large as a number y. The number y is 3 less than the number x. Which system of equations describes this situation?","c":["x + 7 = 2y; y = x − 3","x + 7 = 2y; y = 3 − x","2(x + 7) = y; y = x − 3","2(x + 7) = y; y = 3 − x"],"a":"A","e":"«Сумма x и 7 вдвое больше y»: x + 7 = 2y. «y на 3 меньше x»: y = x − 3."},{"id":345,"s":"systems_linear","t":"solve for y by elimination","d":"m","q":"6x + 7y = 28\n2x + 2y = 10\nThe solution to the given system of equations is (x, y). What is the value of y?","c":["−2","7","14","18"],"a":"A","e":"Второе × 3: 6x + 6y = 30. Вычитаем из первого: y = −2."},{"id":346,"s":"systems_linear","t":"solve for y by elimination","d":"m","q":"3x + 6 = 4y\n3x + 4 = 2y\nThe solution to the given system of equations is (x, y). What is the value of y?","c":[],"a":"1","e":"Вычитаем: 2 = 2y → y = 1."},{"id":347,"s":"systems_linear","t":"no solution, find constant","d":"h","q":"y = (1/2)x + 8\ny = cx + 10\nIn the system of equations above, c is a constant. If the system has no solution, what is the value of c?","c":[],"a":"1/2","e":"Нет решений → параллельны → c = 1/2."},{"id":348,"s":"systems_linear","t":"evaluate expression from system","d":"m","q":"(7/2)x + 6y = 25\n(5/2)x + 6y = 23\nThe solution to the given system of equations is (x, y). What is the value of (17/2)x + 18y?","c":["2","3","48","71"],"a":"D","e":"(17/2)x + 18y = первое + 2 · второе.\n25 + 2 · 23 = 71."},{"id":354,"s":"nonlinear_functions","t":"comparing exponential and linear function values","d":"m","q":"Which of the following is true about the values of 2ˣ and 2x + 2 for x > 0?","c":["For all x > 0, it is true that 2ˣ < 2x + 2.","For all x > 0, it is true that 2ˣ > 2x + 2.","There is a constant c such that if 0 < x < c, then 2ˣ < 2x + 2, but if x > c, then 2ˣ > 2x + 2.","There is a constant c such that if 0 < x < c, then 2ˣ > 2x + 2, but if x > c, then 2ˣ < 2x + 2."],"a":"C","e":"x = 1: 2 < 4; x = 3: 8 = 8; x = 4: 16 > 10.\nДо c = 3 меньше, после — больше.\nDesmos: два графика, точка пересечения."},{"id":359,"s":"two_var_data","t":"choosing type of model","d":"m","q":"An inspector begins a day of work with a large sample of shirts that need to be checked for defects. The inspector works at a constant rate throughout the morning. What type of model is best to model the number of shirts remaining to be checked for defects at any given time throughout the morning?","c":["A linear model with a positive slope","A linear model with a negative slope","An exponential growth model","An exponential decay model"],"a":"B","e":"Скорость постоянная → линейно; рубашек становится меньше → наклон отрицательный."}];

  {k:"psda", n:"Problem-Solving & Data", s:["ratios_rates_units","percentages","one_var_data","two_var_data","probability","inference","study_design"]},
  {k:"geo", n:"Geometry & Trig", s:["area_volume","lines_angles_triangles","right_triangles_trig","circles"]}
];
const SKILL = {
  linear_eq_1var:"Linear equations in 1 variable", linear_eq_2var:"Linear equations in 2 variables",
  linear_functions:"Linear functions", systems_linear:"Systems of linear equations", linear_inequalities:"Linear inequalities",
  equivalent_expressions:"Equivalent expressions", nonlinear_equations:"Nonlinear equations", nonlinear_functions:"Nonlinear functions",
  ratios_rates_units:"Ratios, rates, units", percentages:"Percentages", one_var_data:"One-variable data",
  two_var_data:"Two-variable data", probability:"Probability", inference:"Inference & margin of error",
  study_design:"Study design", area_volume:"Area and volume", lines_angles_triangles:"Lines, angles, triangles",
  right_triangles_trig:"Right triangles & trig", circles:"Circles"
};
const domOf = s => DOMAINS.find(d => d.s.includes(s));

/* ---------- storage: Telegram CloudStorage in the Mini App, localStorage elsewhere ---------- */
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const CLOUD = TG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast("6.9") ? TG.CloudStorage : null;
const KEY = "mm_sat_trainer_v1";
let S = {name:"", done:{}, best:0, streak:0, f:{dom:"", skill:"", diff:"", mode:"all"}};
const packDone = d => Object.entries(d).map(([id,r]) => id + ":" + r.n + ":" + r.ok + ":" + r.last).join(";");
const unpackDone = str => { const d = {}; (str || "").split(";").forEach(x => { const p = x.split(":").map(Number); if (p.length === 4 && p[0]) d[p[0]] = {n:p[1], ok:p[2], last:p[3]}; }); return d; };
const cloudGet = keys => new Promise(res => { try { CLOUD.getItems(keys, (err, v) => res(err ? {} : (v || {}))); } catch(e) { res({}); } });
const cloudSet = (k, v) => { try { CLOUD.setItem(k, v, () => {}); } catch(e) {} };
async function load(){
  if (CLOUD) {
    const v = await cloudGet(["meta","p0","p1","p2"]);
    try { if (v.meta) Object.assign(S, JSON.parse(v.meta)); } catch(e) {}
    S.done = unpackDone([v.p0, v.p1, v.p2].filter(Boolean).join(";"));
  } else {
    try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
  }
  if (!S.name && TG && TG.initDataUnsafe && TG.initDataUnsafe.user) S.suggest = TG.initDataUnsafe.user.first_name || "";
}
function save(){
  if (CLOUD) {
    cloudSet("meta", JSON.stringify({name:S.name, best:S.best, streak:S.streak, f:S.f}));
    const p = packDone(S.done), parts = [];
    for (let i = 0; i < p.length; ) { let j = Math.min(p.length, i + 3900); if (j < p.length) j = p.lastIndexOf(";", j) + 1 || j; parts.push(p.slice(i, j).replace(/;$/, "")); i = j; }
    for (let k = 0; k < 3; k++) cloudSet("p" + k, parts[k] || "");
  } else {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  }
}

/* ---------- math formatting: a/b -> stacked fraction, ^(..) -> sup ---------- */
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TOK = /[0-9A-Za-zπ√∛.²³¹⁰-₟ᴬ-ᶿ_-]/;
function match(s, i, dir){ // i at bracket, returns index of partner
  let depth = 0;
  for (let j = i; j >= 0 && j < s.length; j += dir){
    if (s[j] === (dir>0?"(":")")) depth++;
    else if (s[j] === (dir>0?")":"(")) { depth--; if (!depth) return j; }
  }
  return -1;
}
function strip(x){ if (x[0]==="(" && match(x,0,1)===x.length-1) return x.slice(1,-1); return x; }
function frac(s){
  for (let i = 1; i < s.length-1; i++){
    if (s[i] !== "/" || s[i-1] === " " || s[i+1] === " ") continue;
    let a = i;               // left operand start
    let j = i-1;
    if (s[j] === ")") { const k = match(s,j,-1); if (k < 0) continue; j = k-1; }
    while (j >= 0 && TOK.test(s[j])) j--;
    a = j+1;
    let b = i+1; j = i+1;    // right operand end (exclusive)
    if (s[j] === "(") { const k = match(s,j,1); if (k < 0) continue; j = k+1; }
    else { while (j < s.length && TOK.test(s[j])) j++; if (s[j] === "(" && /[√∛]/.test(s[j-1])) { const k = match(s,j,1); if (k>0) j = k+1; }  while (j > i+1 && s[j-1] === "." && !/\d/.test(s[j] || "")) j--; }
    b = j;
    if (a === i || b === i+1) continue;
    const num = strip(s.slice(a,i)), den = strip(s.slice(i+1,b));
    return frac(s.slice(0,a)) + '<span class="fr"><span>' + frac(num) + '</span><span>' + frac(den) + '</span></span>' + frac(s.slice(b));
  }
  return s;
}
function fmt(raw){
  const sups = [];
  let s = raw;
  // pull out ^( ... ) groups as placeholders
  for (let i = s.indexOf("^("); i >= 0; i = s.indexOf("^(")){
    const k = match(s, i+1, 1); if (k < 0) break;
    sups.push(s.slice(i+2, k)); s = s.slice(0,i) + String.fromCharCode(0xE000 + sups.length-1) + s.slice(k+1);
  }
  s = frac(esc(s)).replace(/\((<span class="fr"><span>(?:(?!<span class="fr">|\)).)*?<\/span><\/span>)\)/g, "$1");
  return s.replace(/[-]/g, c => "<sup>" + esc(sups[c.charCodeAt(0)-0xE000]) + "</sup>");
}
function qhtml(q){
  return q.split("\n").map(line => {
    const words = (line.match(/[A-Za-z]{3,}/g) || []).length;
    const isEq = words <= 1 && line.length < 60 && /[=<>≤≥]|\d/.test(line);
    return '<p' + (isEq ? ' class="eq"' : '') + '>' + fmt(line) + '</p>';
  }).join("");
}

/* ---------- answer checking for grid-in ---------- */
function val(x){
  x = String(x).trim().replace(/\s+/g,"").replace(/[−–]/g,"-").replace(/^\$/,"");
  if (/^-?\d*,\d+$/.test(x)) x = x.replace(",", ".");
  x = x.replace(/,/g, "");
  let m = x.match(/^(-?)(\d*\.?\d+)\/(\d*\.?\d+)$/);
  if (m) { const d = parseFloat(m[3]); return d ? (m[1]?-1:1) * parseFloat(m[2]) / d : NaN; }
  if (/^-?(\d+\.?\d*|\.\d+)$/.test(x)) return parseFloat(x);
  return NaN;
}
function gridOk(input, answer){
  const u = val(input); if (isNaN(u)) return null;
  return answer.split(/,\s+/).some(a => { const v = val(a); return !isNaN(v) && Math.abs(u - v) < 1e-3 * Math.max(1, Math.abs(v) / 100); });
}
const shownAnswer = a => { const seen = []; return a.split(/,\s+/).filter(x => { const v = Math.round(val(x) * 100); if (seen.includes(v)) return false; seen.push(v); return true; }).map(x => x.replace(/^-/,"−").replace(/^\./,"0.")).join(" или "); };

/* ---------- state ---------- */
let cur = null, answered = false, sessionN = 0, sessionOk = 0, lastId = null;

function pool(){
  const f = S.f;
  return TASKS.filter(t => {
    if (f.dom && domOf(t.s).k !== f.dom) return false;
    if (f.skill && t.s !== f.skill) return false;
    if (f.diff && t.d !== f.diff) return false;
    const r = S.done[t.id];
    if (f.mode === "new" && r) return false;
    if (f.mode === "wrong" && !(r && r.last === 0)) return false;
    return true;
  });
}
function pick(){
  let p = pool();
  if (!p.length) { cur = null; render(); return; }
  if (p.length > 1) p = p.filter(t => t.id !== lastId);
  const fresh = p.filter(t => !S.done[t.id]);
  const from = fresh.length && S.f.mode === "all" ? fresh : p;
  cur = from[Math.floor(Math.random() * from.length)];
  lastId = cur.id; answered = false; render();
}

/* ---------- render ---------- */
const $ = id => document.getElementById(id);
function renderFilters(){
  $("dom").innerHTML = [{k:"",n:"Все разделы"}].concat(DOMAINS).map(x => `<option value="${x.k}">${x.n}</option>`).join("");
  $("dom").value = S.f.dom;
  const skills = S.f.dom ? DOMAINS.find(x => x.k === S.f.dom).s : DOMAINS.flatMap(x => x.s);
  const cnt = s => TASKS.filter(t => t.s === s).length;
  $("skill").innerHTML = '<option value="">Все темы</option>' + skills.filter(cnt).map(s => `<option value="${s}">${SKILL[s]} (${cnt(s)})</option>`).join("");
  if (!skills.includes(S.f.skill)) S.f.skill = "";
  $("skill").value = S.f.skill; $("diff").value = S.f.diff; $("mode").value = S.f.mode;
}
function renderScore(){
  $("score").textContent = sessionOk + "/" + sessionN;
  $("streak").textContent = S.streak;
}
function render(){
  renderScore();
  const box = $("task");
  if (!cur) {
    const msg = S.f.mode === "wrong" ? "Ошибок в этой теме нет." : S.f.mode === "new" ? "Все задачи этой темы уже решены. Выбери «Все задачи» или другую тему." : "Здесь пока нет задач.";
    box.innerHTML = `<div class="empty">${msg}</div>`; return;
  }
  const t = cur, dom = domOf(t.s);
  let h = `<div class="meta"><span>${dom.n}</span><span>·</span><span>${SKILL[t.s]}</span><span>·</span><span class="${t.d==="h"?"h":""}">${t.d==="h"?"Hard":"Medium"}</span></div>`;
  h += `<div class="q">${qhtml(t.q)}</div>`;
  if (t.c.length) {
    h += '<div class="opts">' + t.c.map((c,i) => `<button class="opt" type="button" data-i="${i}"><span class="l">${"ABCD"[i]}</span><span class="t">${fmt(c)}</span></button>`).join("") + '</div>';
      } else {
    h += `<form class="grid-in" id="gf"><input id="gi" inputmode="decimal" autocomplete="off" placeholder="Ответ: число или дробь, напр. 7/6" aria-label="Ответ"><button class="btn" type="submit">Проверить</button></form>`;
    h += '<div class="hint">Впиши число. Дробь через «/», например 7/6.</div>';
  }
  h += '<div id="res"></div>';
  box.innerHTML = h;
  if (!t.c.length) { const gi = $("gi"); setTimeout(() => gi && gi.focus({preventScroll:true}), 0); }
}
function explain(ok, extra){
  const steps = cur.e.split("\n").map(l => `<li class="${/^Desmos/.test(l)?"desmos":""}">${fmt(l)}</li>`).join("");
  $("res").innerHTML = `<div class="res ${ok?"ok":"bad"}"><h3>${ok ? "Верно" : "Неверно."} ${extra}</h3><ul class="steps">${steps}</ul></div>
  <div class="actions"><button class="btn" type="button" id="next">Следующая задача →</button></div>`;
  $("next").focus({preventScroll:true});
}
function record(ok){
  answered = true; sessionN++; if (ok) sessionOk++;
  const r = S.done[cur.id] || {n:0, ok:0, last:0};
  r.n++; if (ok) r.ok++; r.last = ok ? 1 : 0; S.done[cur.id] = r;
  S.streak = ok ? S.streak + 1 : 0; S.best = Math.max(S.best, S.streak);
  save(); renderScore(); renderProg();
}
function chooseMC(i){
  if (answered || !cur) return;
  const right = "ABCD".indexOf(cur.a), ok = i === right;
  document.querySelectorAll(".opt").forEach((b,j) => { b.disabled = true; if (j === right) b.classList.add("ok"); else if (j === i) b.classList.add("bad"); });
  record(ok);
  explain(ok, ok ? "" : "Правильный ответ: " + cur.a + ".");
}
function submitGrid(){
  if (answered || !cur) return;
  const v = $("gi").value; const ok = gridOk(v, cur.a);
  if (ok === null) { $("res").innerHTML = '<div class="hint" style="color:var(--bad)">Впиши число, например 12, −3, 1.5 или 7/6.</div>'; return; }
  $("gi").disabled = true;
  record(ok);
  explain(ok, ok ? "" : "Правильный ответ: " + fmt(shownAnswer(cur.a)) + ".");
}
function renderProg(){
  const rows = DOMAINS.map(d => {
    const ids = TASKS.filter(t => d.s.includes(t.s));
    const tried = ids.filter(t => S.done[t.id]);
    const ok = tried.filter(t => S.done[t.id].last === 1).length;
    return {d, total: ids.length, tried: tried.length, ok};
  });
  const triedAll = rows.reduce((a,r) => a + r.tried, 0);
  const weak = Object.keys(SKILL).map(s => {
    const tr = TASKS.filter(t => t.s === s && S.done[t.id]);
    return {s, n: tr.length, ok: tr.filter(t => S.done[t.id].last === 1).length};
  }).filter(x => x.n >= 3).sort((a,b) => a.ok/a.n - b.ok/b.n)[0];
  let h = `<h2>Прогресс</h2><p class="note">Решено ${triedAll} из ${TASKS.length} · лучшая серия ${S.best}</p><div class="bars">`;
  h += rows.map(r => {
    const pct = r.tried ? Math.round(100 * r.ok / r.tried) : 0;
    return `<div class="bar"><span>${r.d.n}</span><b>${r.tried ? pct + "% · " : ""}${r.tried}/${r.total}</b><div class="tr"><i style="width:${Math.round(100*r.tried/r.total)}%"></i></div></div>`;
  }).join("") + "</div>";
  if (weak && weak.ok / weak.n < 0.8) h += `<div class="weak"><span>Слабая тема: ${SKILL[weak.s]} (${weak.ok}/${weak.n})</span> <button class="btn ghost" type="button" id="train" data-s="${weak.s}">Тренировать</button></div>`;
  if (triedAll) h += `<div class="actions"><button class="btn ghost" type="button" id="reset">Сбросить</button></div>`;
  $("prog").innerHTML = h;
}

/* ---------- events ---------- */
$("dom").addEventListener("change", e => { S.f.dom = e.target.value; S.f.skill = ""; save(); renderFilters(); pick(); });
$("skill").addEventListener("change", e => { S.f.skill = e.target.value; save(); pick(); });
$("diff").addEventListener("change", e => { S.f.diff = e.target.value; save(); pick(); });
$("mode").addEventListener("change", e => { S.f.mode = e.target.value; save(); pick(); });
$("task").addEventListener("click", e => {
  const o = e.target.closest(".opt"); if (o) return chooseMC(+o.dataset.i);
  if (e.target.id === "next") pick();
});
$("task").addEventListener("submit", e => { e.preventDefault(); submitGrid(); });
let resetArm = false;
$("prog").addEventListener("click", e => {
  if (e.target.id === "train") { const s = e.target.dataset.s; S.f.dom = domOf(s).k; S.f.skill = s; S.f.mode = "all"; save(); renderFilters(); pick(); window.scrollTo({top:0, behavior:"smooth"}); }
  if (e.target.id === "reset") {
    if (!resetArm) { resetArm = true; e.target.textContent = "Точно сбросить? Нажми ещё раз"; return; }
    S.done = {}; S.best = 0; S.streak = 0; resetArm = false; save(); renderProg(); renderScore();
  }
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey) return;
  if (!cur) return;
  if (answered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pick(); return; }
  if (!answered && cur.c.length) {
    const i = "abcd".indexOf(e.key.toLowerCase()) >= 0 ? "abcd".indexOf(e.key.toLowerCase()) : "1234".indexOf(e.key);
    if (i >= 0) chooseMC(i);
  }
});

function showName(){
  $("namebox").hidden = false; $("app").hidden = true; document.querySelector(".filters").hidden = true; document.querySelector(".stat").hidden = true;
  $("ni").value = S.name || S.suggest || ""; setTimeout(() => $("ni").focus(), 0);
}
function startApp(){
  $("namebox").hidden = true; $("app").hidden = false; document.querySelector(".filters").hidden = false; document.querySelector(".stat").hidden = false;
  $("who").hidden = false; $("who").textContent = S.name;
  renderFilters(); renderProg(); pick();
}
$("nf").addEventListener("submit", e => { e.preventDefault(); const n = $("ni").value.trim(); if (!n) return; S.name = n; save(); startApp(); });
$("who").addEventListener("click", showName);
if (TG) { try { TG.ready(); TG.expand(); } catch(e) {} }
load().then(() => S.name ? startApp() : showName());
</script>

</body>
