name: Deploy API (Cloudflare Worker)
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            BOT_TOKEN
            BOT_TOKEN_SAT
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_TOKEN_SAT: ${{ secrets.BOT_TOKEN_SAT }}
      - name: Webhook и меню бота-тренажёра
        env:
          T: ${{ secrets.BOT_TOKEN_SAT }}
        run: |
          [ -n "$T" ] || exit 0
          S=$(printf '%s' "$T" | sha256sum | cut -c1-40)
          API="https://api.telegram.org/bot$T"
          APP="https://mathmaks4406-maker.github.io/math-maks-app/"
          curl -sf "$API/setWebhook" -d url=https://math-maks-api.math-maks4406.workers.dev/tg/hook -d secret_token="$S" -d allowed_updates='["message"]' -d drop_pending_updates=true | grep -o '"ok":true'
          curl -sf "$API/setChatMenuButton" -H 'Content-Type: application/json' -d "{\"menu_button\":{\"type\":\"web_app\",\"text\":\"Тренажёр\",\"web_app\":{\"url\":\"$APP\"}}}" | grep -o '"ok":true'
          curl -sf "$API/setMyCommands" -H 'Content-Type: application/json' -d '{"commands":[{"command":"start","description":"Как пользоваться тренажёром"}]}' | grep -o '"ok":true'
